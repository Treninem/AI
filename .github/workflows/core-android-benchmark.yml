name: AuroraFox Core Android Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/core/android_probe/**'
      - 'tests/test_core_android_benchmark_contract.py'
      - 'android_plugin/plugin/**'
      - 'android_plugin/setup_native.ps1'
      - 'build/prepare_bundled_core_model.ps1'
      - '.github/workflows/core-android-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/core/android_probe/**'
      - 'tests/test_core_android_benchmark_contract.py'
      - 'android_plugin/plugin/**'
      - 'android_plugin/setup_native.ps1'
      - 'build/prepare_bundled_core_model.ps1'
      - '.github/workflows/core-android-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: aurorafox-core-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_core_android_benchmark_contract.py

  real-core-android-emulator:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AURORAFOX_NATIVE_CACHE_DIR: ${{ github.workspace }}/.ci/native-cache
      CORE_MODEL: ${{ github.workspace }}/.ci/android-core/aurorafox-core.gguf
      CORE_SHA: d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.1' \
            'cmake;3.22.1' \
            'ndk;28.1.13356709'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Restore verified Core model cache
        id: model_cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/core-model-cache
          key: aurorafox-core-android-v1-d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5

      - name: Restore pinned Android native cache
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci/native-cache
            android_plugin/plugin/src/main/cpp/third_party
            android_plugin/plugin/libs
            android_plugin/plugin/src/main/assets/voice
          key: aurorafox-android-native-v1-llama-6d054983-wasm3-2f3123df-sherpa-1.13.4

      - name: Prepare verified bundled Core weights
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force (Split-Path -Parent $env:CORE_MODEL) | Out-Null
          ./build/prepare_bundled_core_model.ps1 -Destination $env:CORE_MODEL -CacheDir "$PWD/.ci/core-model-cache"
          $sha = (Get-FileHash -LiteralPath $env:CORE_MODEL -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:CORE_SHA) { throw "Android benchmark model SHA mismatch: $sha" }

      - name: Save verified Core model cache
        if: steps.model_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/core-model-cache
          key: ${{ steps.model_cache.outputs.cache-primary-key }}

      - name: Prepare exact pinned production native runtime sources
        shell: pwsh
        run: |
          ./android_plugin/setup_native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Android native runtime setup failed' }

      - name: Save pinned Android native cache
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/native-cache
            android_plugin/plugin/src/main/cpp/third_party
            android_plugin/plugin/libs
            android_plugin/plugin/src/main/assets/voice
          key: ${{ steps.native_cache.outputs.cache-primary-key }}

      - name: Build benchmark app against production AuroraFox runtime module
        shell: bash
        run: |
          set -euo pipefail
          gradle -p benchmarks/core/android_probe :app:assembleDebug --build-cache --no-daemon --stacktrace
          test -s benchmarks/core/android_probe/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Run real bundled Core on Android 35 emulator without INTERNET permission
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096
          script: |
            set -eu
            pkg='com.aurorafox.corebenchmark'
            apk='benchmarks/core/android_probe/app/build/outputs/apk/debug/app-debug.apk'
            report='artifacts/core-benchmark-android.json'
            mkdir -p artifacts
            adb install -r "$apk"
            if adb shell dumpsys package "$pkg" | grep -q 'android.permission.INTERNET'; then
              echo 'Benchmark app unexpectedly requests INTERNET permission.' >&2
              exit 1
            fi
            adb push "$CORE_MODEL" /data/local/tmp/aurorafox-core.gguf
            adb shell run-as "$pkg" mkdir -p files
            adb shell run-as "$pkg" cp /data/local/tmp/aurorafox-core.gguf files/aurorafox-core.gguf
            adb shell rm -f /data/local/tmp/aurorafox-core.gguf
            adb shell run-as "$pkg" ls -l files/aurorafox-core.gguf
            adb logcat -c
            adb shell am force-stop "$pkg"
            adb shell am start -W -n "$pkg/.MainActivity"
            i=0
            while [ "$i" -lt 180 ]; do
              if adb shell run-as "$pkg" test -s files/core-benchmark-android.json; then
                break
              fi
              sleep 5
              i=$((i + 1))
            done
            if ! adb shell run-as "$pkg" test -s files/core-benchmark-android.json; then
              echo 'Android Core benchmark timed out after 900 seconds.' >&2
              adb logcat -d -v brief | tail -n 400 >&2
              exit 1
            fi
            adb shell run-as "$pkg" cat files/core-benchmark-android.json > "$report"
            adb logcat -d -v brief > artifacts/core-benchmark-android-logcat.txt
            python - <<'PY'
            import json
            from pathlib import Path
            path = Path('artifacts/core-benchmark-android.json')
            data = json.loads(path.read_text(encoding='utf-8'))
            failures = []
            if data.get('status') != 'completed': failures.append('status')
            if data.get('passed') is not True: failures.append('overall')
            env = data.get('environment', {})
            if env.get('internet_permission_granted') is not False: failures.append('internet_permission')
            if env.get('network_forbidden_by_manifest') is not True: failures.append('network_guard')
            core = data.get('core', {})
            if core.get('runtime') != 'llama.cpp': failures.append('runtime')
            if core.get('native_library_loaded') is not True or core.get('llama_cpp') is not True: failures.append('native_llama')
            if core.get('prepared_sha256') != 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5': failures.append('model_sha')
            perf = data.get('performance', {})
            for key in ('cold_first_response_ms', 'warm_median_ms', 'process_pss_mb'):
                if float(perf.get(key, 0) or 0) <= 0: failures.append(key)
            scenarios = data.get('scenarios', [])
            if len(scenarios) != 3 or any(row.get('passed') is not True for row in scenarios): failures.append('scenarios')
            print(json.dumps(data, ensure_ascii=False, indent=2))
            if failures:
                raise SystemExit('AURORAFOX_ANDROID_CORE_GATE_FAILED: ' + ','.join(failures))
            print('AURORAFOX_ANDROID_REAL_CORE_GATE_OK')
            PY

      - name: Upload Android Core benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurorafox-core-android-benchmark-${{ github.sha }}
          path: |
            artifacts/core-benchmark-android.json
            artifacts/core-benchmark-android-logcat.txt
          if-no-files-found: warn
          retention-days: 30
