name: AuroraFox UI Visual CI

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'work/**'
      - 'api/settings_overlay.gd'
      - 'update/update_overlay.gd'
      - 'assets/ui/**'
      - 'tests/desktop_ui_smoke.gd'
      - 'tests/ui_owner_assets_smoke.gd'
      - 'tests/ui_state_smoke.gd'
      - 'tests/ui_visual_capture.gd'
      - 'tests/ui_state_visual_capture.gd'
      - 'main.tscn'
      - 'project.godot'
      - '.github/workflows/ui-visual-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
          ./godot --version

      - name: Import project and parse scripts
        shell: bash
        run: timeout 90s ./godot --headless --editor --path . --quit

      - name: Structural desktop and Android portrait UI gate
        shell: bash
        run: timeout 45s ./godot --headless --path . --script tests/desktop_ui_smoke.gd

      - name: Canonical owner-art UI gate
        shell: bash
        run: timeout 45s ./godot --headless --path . --script tests/ui_owner_assets_smoke.gd

      - name: Safe-area keyboard loading offline error cancel gate
        shell: bash
        run: timeout 45s ./godot --headless --path . --script tests/ui_state_smoke.gd

      - name: Render real UI acceptance matrix
        shell: bash
        env:
          GODOT_AUDIO_DRIVER: Dummy
          AURORA_UI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui
          xvfb-run -a -s '-screen 0 1600x1400x24' timeout 120s ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/ui_visual_capture.gd

          images=(
            artifacts/ui/desktop_chat_1440x900.png
            artifacts/ui/desktop_settings_general_1440x900.png
            artifacts/ui/desktop_account_login_1440x900.png
            artifacts/ui/desktop_personal_memory_guest_1440x900.png
            artifacts/ui/desktop_files_projects_1440x900.png
            artifacts/ui/desktop_tools_1440x900.png
            artifacts/ui/desktop_knowledge_base_1440x900.png
            artifacts/ui/desktop_updates_1440x900.png
            artifacts/ui/desktop_compact_chat_960x640.png
            artifacts/ui/desktop_compact_settings_960x640.png
            artifacts/ui/desktop_compact_account_960x640.png
            artifacts/ui/android_portrait_chat_720x1280.png
            artifacts/ui/android_portrait_chat_drawer_720x1280.png
            artifacts/ui/android_portrait_settings_general_720x1280.png
            artifacts/ui/android_portrait_account_login_720x1280.png
            artifacts/ui/android_portrait_personal_memory_guest_720x1280.png
            artifacts/ui/android_portrait_files_projects_720x1280.png
            artifacts/ui/android_portrait_tools_720x1280.png
            artifacts/ui/android_portrait_knowledge_base_720x1280.png
            artifacts/ui/android_portrait_updates_720x1280.png
            artifacts/ui/android_narrow_chat_480x960.png
            artifacts/ui/android_narrow_settings_480x960.png
            artifacts/ui/android_narrow_account_480x960.png
          )
          for image in "${images[@]}"; do
            test -s "$image"
            file "$image"
          done

          test -s artifacts/ui/acceptance_manifest.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = Path('artifacts/ui/acceptance_manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          expected_sha = os.environ['AURORA_UI_HEAD_SHA']
          assert data['head_sha'] == expected_sha, (data['head_sha'], expected_sha)
          assert len(data['captures']) == 23, len(data['captures'])
          assert data['known_missing_client_surfaces'] == []
          surfaces = {item['surface'] for item in data['captures']}
          for required in {'login_guest', 'user_memory_management', 'files_projects', 'knowledge_base', 'updates_error_resilience'}:
              assert required in surfaces, (required, sorted(surfaces))
          assert any(item['requested_viewport'] == {'width': 960, 'height': 640} for item in data['captures'])
          assert any(item['requested_viewport'] == {'width': 480, 'height': 960} for item in data['captures'])
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Render transient responsive states
        shell: bash
        env:
          GODOT_AUDIO_DRIVER: Dummy
          AURORA_UI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1400x24' timeout 90s ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/ui_state_visual_capture.gd

          images=(
            artifacts/ui/android_state_safe_area_720x1280.png
            artifacts/ui/android_state_keyboard_480x960.png
            artifacts/ui/desktop_state_account_loading_960x640.png
            artifacts/ui/android_state_account_offline_error_720x1280.png
            artifacts/ui/desktop_state_knowledge_cancel_1440x900.png
          )
          for image in "${images[@]}"; do
            test -s "$image"
            file "$image"
          done

          test -s artifacts/ui/state_acceptance_manifest.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('artifacts/ui/state_acceptance_manifest.json').read_text(encoding='utf-8'))
          expected_sha = os.environ['AURORA_UI_HEAD_SHA']
          assert data['head_sha'] == expected_sha, (data['head_sha'], expected_sha)
          assert len(data['states']) == 5, len(data['states'])
          states = {item['state'] for item in data['states']}
          assert states == {'safe_area', 'keyboard', 'loading', 'offline_error', 'cancel'}, states
          for item in data['states']:
              assert item['head_sha'] == expected_sha, item
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Upload UI acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: AuroraFox-UI-Visual-Acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ui/*
          if-no-files-found: error
          retention-days: 14
