name: AuroraFox Knowledge Resilience Batch

on:
  pull_request:
    paths:
      - 'benchmarks/knowledge/concurrency_race_probe.gd'
      - 'benchmarks/knowledge/run_resilience_batch.py'
      - 'benchmarks/knowledge/validate_resilience_batch.py'
      - 'benchmarks/knowledge/validate_performance_report.py'
      - 'benchmarks/knowledge/run_godot_probe.py'
      - 'benchmarks/knowledge/run_interrupted_import_recovery.py'
      - 'benchmarks/knowledge/run_interrupted_removal_recovery.py'
      - 'benchmarks/knowledge/run_registry_scaling.py'
      - 'benchmarks/knowledge/record_dedupe_shared_source_probe.gd'
      - 'benchmarks/knowledge/dedupe_alias_removal_probe.gd'
      - 'benchmarks/knowledge/legacy_unregistered_rollback_probe.gd'
      - 'benchmarks/knowledge/write_failure_rollback_probe.gd'
      - 'benchmarks/knowledge/registry_truncated_temp_probe.gd'
      - 'tests/test_knowledge_resilience_batch.py'
      - 'tests/test_knowledge_resilience_gate.py'
      - 'tests/test_knowledge_performance_validator.py'
      - 'scripts/knowledge_import_transaction.gd'
      - 'scripts/knowledge_source_registry.gd'
      - 'scripts/knowledge_manager.gd'
      - 'scripts/knowledge_store.gd'
      - '.github/workflows/knowledge-performance-concurrency.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/knowledge/concurrency_race_probe.gd'
      - 'benchmarks/knowledge/run_resilience_batch.py'
      - 'benchmarks/knowledge/validate_resilience_batch.py'
      - 'benchmarks/knowledge/validate_performance_report.py'
      - 'benchmarks/knowledge/run_godot_probe.py'
      - 'benchmarks/knowledge/run_interrupted_import_recovery.py'
      - 'benchmarks/knowledge/run_interrupted_removal_recovery.py'
      - 'benchmarks/knowledge/run_registry_scaling.py'
      - 'benchmarks/knowledge/record_dedupe_shared_source_probe.gd'
      - 'benchmarks/knowledge/dedupe_alias_removal_probe.gd'
      - 'benchmarks/knowledge/legacy_unregistered_rollback_probe.gd'
      - 'benchmarks/knowledge/write_failure_rollback_probe.gd'
      - 'benchmarks/knowledge/registry_truncated_temp_probe.gd'
      - 'tests/test_knowledge_resilience_batch.py'
      - 'tests/test_knowledge_resilience_gate.py'
      - 'tests/test_knowledge_performance_validator.py'
      - 'scripts/knowledge_import_transaction.gd'
      - 'scripts/knowledge_source_registry.gd'
      - 'scripts/knowledge_manager.gd'
      - 'scripts/knowledge_store.gd'
      - '.github/workflows/knowledge-performance-concurrency.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurorafox-knowledge-resilience-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  resilience-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Validate consolidated batch contract
        run: >-
          python -m unittest
          tests.test_knowledge_resilience_batch
          tests.test_knowledge_resilience_gate
          tests.test_knowledge_performance_validator
          -v
      - name: Compile batch runners
        run: >-
          python -m py_compile
          benchmarks/knowledge/run_resilience_batch.py
          benchmarks/knowledge/validate_resilience_batch.py
          benchmarks/knowledge/validate_performance_report.py
          benchmarks/knowledge/run_registry_scaling.py
      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
          ./godot --version
      - name: Import and parse project
        run: timeout 120s ./godot --headless --editor --path . --quit
      - name: Run consolidated race scaling and failure injection batch
        run: >-
          python benchmarks/knowledge/run_resilience_batch.py
          --godot ./godot
          --counts 16,32,64
          --source-kb 4
          --timeout-seconds 300
          --enforce-performance
          --report artifacts/knowledge-performance/resilience-linux.json
      - name: Validate consolidated resilience evidence
        run: >-
          python benchmarks/knowledge/validate_resilience_batch.py
          artifacts/knowledge-performance/resilience-linux.json
          --output artifacts/knowledge-performance/resilience-linux-gate.json
      - name: Upload Linux resilience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-resilience-linux-${{ github.sha }}
          path: artifacts/knowledge-performance/
          if-no-files-found: error

  resilience-windows:
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Validate consolidated batch contract
        shell: powershell
        run: >-
          python -m unittest
          tests.test_knowledge_resilience_batch
          tests.test_knowledge_resilience_gate
          tests.test_knowledge_performance_validator
          -v
      - name: Compile batch runners
        shell: powershell
        run: >-
          python -m py_compile
          benchmarks/knowledge/run_resilience_batch.py
          benchmarks/knowledge/validate_resilience_batch.py
          benchmarks/knowledge/validate_performance_report.py
          benchmarks/knowledge/run_registry_scaling.py
      - name: Download Godot 4.7.1
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip' -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath godot-bin -Force
          $godot = Get-ChildItem -Path godot-bin -Filter 'Godot_v4.7.1-stable_win64.exe' -Recurse | Select-Object -First 1
          if (-not $godot) { throw 'Godot executable missing' }
          Copy-Item $godot.FullName '.\godot.exe'
          .\godot.exe --version
      - name: Import and parse project
        shell: powershell
        run: .\godot.exe --headless --editor --path . --quit
      - name: Run consolidated race scaling and failure injection batch
        shell: powershell
        run: >-
          python benchmarks/knowledge/run_resilience_batch.py
          --godot .\godot.exe
          --counts 8,16,32
          --source-kb 4
          --timeout-seconds 300
          --enforce-performance
          --report artifacts/knowledge-performance/resilience-windows.json
      - name: Validate consolidated resilience evidence
        shell: powershell
        run: >-
          python benchmarks/knowledge/validate_resilience_batch.py
          artifacts/knowledge-performance/resilience-windows.json
          --output artifacts/knowledge-performance/resilience-windows-gate.json
      - name: Upload Windows resilience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-resilience-windows-${{ github.sha }}
          path: artifacts/knowledge-performance/
          if-no-files-found: error
