name: AuroraFox Voice CI

on:
  push:
    branches: [main]
    paths:
      - 'voice/**'
      - 'scripts/**'
      - 'tests/**'
      - 'project.godot'
      - 'main.tscn'
      - '.github/workflows/voice-ci.yml'
  pull_request:
    paths:
      - 'voice/**'
      - 'scripts/**'
      - 'tests/**'
      - 'project.godot'
      - 'main.tscn'
      - '.github/workflows/voice-ci.yml'
  workflow_dispatch:

jobs:
  python-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q voice/python voice/voice_service.py tests
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.1 numpy==2.2.6
      - name: Run voice unit tests
        run: pytest -q tests/test_voice_text.py tests/test_voice_configs.py

  godot-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      - name: Import project and parse scripts
        run: timeout 60s ./godot --headless --editor --path . --quit
      - name: Run voice GDScript smoke test
        run: timeout 30s ./godot --headless --path . --script tests/voice_smoke.gd
