name: AuroraFox Core / Voice CI

on:
  push:
    branches: [main]
    paths:
      - 'voice/**'
      - 'runtime/**'
      - 'update/**'
      - 'scripts/**'
      - 'tests/**'
      - 'android_plugin/**'
      - 'build/**'
      - 'project.godot'
      - 'main.tscn'
      - 'export_presets.cfg'
      - '.github/workflows/voice-ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'voice/**'
      - 'runtime/**'
      - 'update/**'
      - 'scripts/**'
      - 'tests/**'
      - 'android_plugin/**'
      - 'build/**'
      - 'project.godot'
      - 'main.tscn'
      - 'export_presets.cfg'
      - '.github/workflows/voice-ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  python-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q voice/python voice/voice_service.py tests
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.1 numpy==2.2.6
      - name: Run voice unit tests
        run: pytest -q tests/test_voice_text.py tests/test_voice_configs.py

  godot-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
          ./godot --version
      - name: Import project and parse scripts
        run: timeout 90s ./godot --headless --editor --path . --quit
      - name: Run voice GDScript smoke test
        run: timeout 30s ./godot --headless --path . --script tests/voice_smoke.gd
      - name: Run updater GDScript smoke test
        run: timeout 30s ./godot --headless --path . --script tests/update_smoke.gd

  windows-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify managed uv bootstrap without system Python dependency
        shell: powershell
        run: |
          .\runtime\ensure_uv.ps1 -RuntimeRoot "$env:RUNNER_TEMP\aurora-runtime" -SkipPythonInstall | Out-Null
          $uv = Join-Path $env:RUNNER_TEMP 'aurora-runtime\uv\uv.exe'
          if (-not (Test-Path $uv)) { throw 'uv.exe was not prepared' }
          & $uv --version
          if ($LASTEXITCODE -ne 0) { throw 'bundled uv bootstrap is not executable' }
      - name: Verify release version synchronization
        shell: powershell
        run: .\tests\version_sync_test.ps1
      - name: Run transactional updater integration test
        shell: powershell
        run: .\tests\windows_updater_test.ps1
