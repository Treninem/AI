name: Qwen3.5-2B Q3 local Core research (isolated)

on:
  push:
    branches: [experiment/v15-low-ram-model-probe]
    paths:
      - .github/workflows/qwen35-2b-q3-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-model-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact experiment checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Self-test the public synthetic probe
        run: |
          python3 -m py_compile benchmarks/core/model_size_probe.py
          python3 benchmarks/core/model_size_probe.py --self-test
      - name: Fetch pinned CPU engine and two pinned GGUF files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fox-engine" "$RUNNER_TEMP/fox-models"
          curl -fL --retry 2 --connect-timeout 30 --max-time 600 \
            'https://github.com/ggml-org/llama.cpp/releases/download/b11717/llama-b11717-bin-ubuntu-x64.tar.gz' \
            -o "$RUNNER_TEMP/llama-b11717.tar.gz"
          printf '%s  %s\n' '1fce11be93423044e073a9a967b99998569c4bd343220f60ef98b080385d09cb' "$RUNNER_TEMP/llama-b11717.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/llama-b11717.tar.gz" -C "$RUNNER_TEMP/fox-engine"
          curl -fL --retry 2 --connect-timeout 30 --max-time 1800 \
            'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true' \
            -o "$RUNNER_TEMP/fox-models/current.gguf"
          printf '%s  %s\n' 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5' "$RUNNER_TEMP/fox-models/current.gguf" | sha256sum -c -
          curl -fL --retry 2 --connect-timeout 30 --max-time 1800 \
            'https://huggingface.co/bartowski/Qwen_Qwen3.5-2B-GGUF/resolve/main/Qwen_Qwen3.5-2B-Q3_K_M.gguf?download=true' \
            -o "$RUNNER_TEMP/fox-models/qwen35-2b-q3.gguf"
          printf '%s  %s\n' 'f3a0c4bd6cf01797193b97bb171f08cdc25efdbecd3da2fa2a142a953c78cdcb' "$RUNNER_TEMP/fox-models/qwen35-2b-q3.gguf" | sha256sum -c -
      - name: Compare synthetic answers, latency and memory on one CPU runner
        shell: bash
        run: |
          set -euo pipefail
          engine="$(find "$RUNNER_TEMP/fox-engine" -type f -name llama-server -print -quit)"
          test -n "$engine"
          chmod +x "$engine"
          python3 benchmarks/core/model_size_probe.py --engine "$engine" \
            --model current "$RUNNER_TEMP/fox-models/current.gguf" 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5' \
            --model qwen35-2b-q3 "$RUNNER_TEMP/fox-models/qwen35-2b-q3.gguf" 'f3a0c4bd6cf01797193b97bb171f08cdc25efdbecd3da2fa2a142a953c78cdcb' \
            --output model-size-probe.json
      - name: Retain only the small synthetic research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-2b-q3-probe
          path: |
            model-size-probe.json
            current-engine.log
            qwen35-2b-q3-engine.log
          if-no-files-found: warn
          retention-days: 7
