name: AuroraFox Voice Soft SSML A-B

on:
  workflow_dispatch:
  push:
    paths:
      - "voice/tools/ssml_soft_ab.py"
      - ".github/workflows/voice-ssml-soft-ab.yml"

permissions:
  contents: read

jobs:
  soft-ssml-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU acoustic benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.0 torchaudio==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install silero==0.5.5 soundfile==0.13.1 numpy==2.2.6 transformers==4.57.1 accelerate==1.10.1 utmos-pytorch

      - name: Run soft SSML A-B quality gate
        run: python voice/tools/ssml_soft_ab.py

      - name: Upload soft SSML A-B samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurorafox-voice-soft-ssml-${{ github.sha }}
          path: artifacts/voice_ssml_soft/
          if-no-files-found: warn
          retention-days: 14
