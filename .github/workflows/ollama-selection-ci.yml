name: AuroraFox Ollama Model Selection CI

on:
  pull_request:
    paths:
      - 'scripts/ai_client.gd'
      - 'models/model_setup_wizard.gd'
      - 'tests/ollama_model_selection_smoke.gd'
      - '.github/workflows/ollama-selection-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-ollama-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        env:
          AURORA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import os, subprocess, sys; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['AURORA_EXPECTED_HEAD_SHA']; print('AURORA_CI_CHECKOUT_SHA=' + actual); sys.exit(0 if actual == expected else 'Candidate checkout SHA mismatch: expected ' + expected)"
      - name: Download Godot 4.7.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
      - name: Import and parse project
        run: timeout 90s ./godot --headless --editor --path . --quit
      - name: Test existing Ollama model selection
        run: timeout 30s ./godot --headless --path . --script tests/ollama_model_selection_smoke.gd
