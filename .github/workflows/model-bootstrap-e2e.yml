name: AuroraFox Core Bootstrap E2E

on:
  workflow_dispatch:
  push:
    branches:
      - 'model-bootstrap-e2e/**'
      - 'main'
    paths:
      - 'core_runtime/**'
      - 'models/**'
      - 'scripts/aurora_core_runtime.gd'
      - 'scripts/desktop_local_runtime.gd'
      - 'scripts/local_model_manager.gd'
      - 'scripts/ai_client.gd'
      - 'scripts/knowledge_*.gd'
      - 'scripts/knowledge_base_overlay.gd'
      - 'main.tscn'
      - 'tests/model_bootstrap_e2e.gd'
      - 'build/build_windows.ps1'
      - '.github/workflows/model-bootstrap-e2e.yml'
  pull_request:
    paths:
      - 'core_runtime/**'
      - 'models/**'
      - 'scripts/aurora_core_runtime.gd'
      - 'scripts/desktop_local_runtime.gd'
      - 'scripts/local_model_manager.gd'
      - 'scripts/ai_client.gd'
      - 'scripts/knowledge_*.gd'
      - 'scripts/knowledge_base_overlay.gd'
      - 'main.tscn'
      - 'tests/model_bootstrap_e2e.gd'
      - 'build/build_windows.ps1'
      - '.github/workflows/model-bootstrap-e2e.yml'

permissions:
  contents: read

jobs:
  windows-core-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell bootstraps
        shell: powershell
        run: |
          foreach ($script in @('.\core_runtime\install_core.ps1','.\models\install_models.ps1','.\build\build_windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script :: $($_.Message)" }
              throw "$script parse failed"
            }
          }

      - name: Install verified AuroraFox Core Engine
        shell: powershell
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'aurora-core-setup-state.json'
          .\core_runtime\install_core.ps1 -StateFile $state
          if ($LASTEXITCODE -ne 0) { throw "Core Engine installer exited with $LASTEXITCODE" }
          if (-not (Test-Path $state)) { throw 'Core Engine state file missing' }
          $data = Get-Content $state -Raw | ConvertFrom-Json
          if ($data.stage -ne 'ready' -or [int]$data.progress -ne 100) {
            throw "Core Engine did not reach ready/100: $(Get-Content $state -Raw)"
          }
          $server = '.\core_runtime\engine\llama-server.exe'
          if (-not (Test-Path $server)) { throw 'llama-server.exe missing after verified Core setup' }
          & $server --version
          if ($LASTEXITCODE -ne 0) { throw 'AuroraFox Core Engine smoke test failed' }
          Get-Content $state

      - name: Verify compatibility bootstrap does not require Ollama
        shell: powershell
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'aurora-model-compat-state.json'
          .\models\install_models.ps1 -Profile core -StateFile $state
          if ($LASTEXITCODE -ne 0) { throw "Compatibility bootstrap exited with $LASTEXITCODE" }
          $data = Get-Content $state -Raw | ConvertFrom-Json
          if ($data.stage -ne 'ready' -or [int]$data.progress -ne 100) { throw 'Compatibility bootstrap did not reach ready' }
          if ($data.ollama_required -ne $false) { throw 'Compatibility bootstrap unexpectedly requires Ollama' }
          if (Get-Process -Name 'ollama' -ErrorAction SilentlyContinue) { throw 'Bootstrap unexpectedly started Ollama' }

      - name: Download Godot 4.7.1
        id: godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot/releases/download/4.7.1-stable'
          New-Item -ItemType Directory -Force .ci\godot | Out-Null
          Invoke-WebRequest "$base/Godot_v4.7.1-stable_win64.exe.zip" -OutFile .ci\godot.zip
          Expand-Archive .ci\godot.zip .ci\godot -Force
          $godot = (Get-ChildItem .ci\godot -Filter '*_console.exe' | Select-Object -First 1).FullName
          if (-not $godot) { $godot = (Get-ChildItem .ci\godot -Filter '*.exe' | Select-Object -First 1).FullName }
          if (-not $godot) { throw 'Godot executable not found' }
          "path=$godot" >> $env:GITHUB_OUTPUT
          & $godot --version

      - name: Parse and import AuroraFox project
        shell: pwsh
        run: |
          & '${{ steps.godot.outputs.path }}' --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot project import / script parse failed' }

      - name: Run Core and Knowledge contracts
        shell: pwsh
        run: |
          & '${{ steps.godot.outputs.path }}' --headless --path . --script tests/model_bootstrap_e2e.gd
          if ($LASTEXITCODE -ne 0) { throw 'AuroraFox Core bootstrap contract failed' }
