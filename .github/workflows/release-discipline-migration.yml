name: AuroraFox Release Discipline Migration

on:
  push:
    branches: [main]
    paths:
      - 'build/apply_release_discipline.py'
      - '.github/workflows/release-discipline-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurorafox-release-discipline-migration
  cancel-in-progress: false

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh exact main before migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Apply deterministic migration
        run: python3 build/apply_release_discipline.py

      - name: Install lightweight Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==8.4.1 numpy==2.2.6 requests==2.32.5

      - name: Run release/version contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q build tests agent api voice/python file_intelligence
          PYTHONPATH="$PWD" python3 -m pytest -q \
            tests/test_release_channel_contract.py \
            tests/test_project_master_contract.py \
            tests/test_standalone_core_contract.py \
            tests/test_autonomous_evolution_contract.py
          pwsh -NoProfile -File tests/version_sync_test.ps1
          git diff --check

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
          ./godot --version

      - name: Parse project and run updater/self-reliance smokes
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./godot --headless --editor --path . --quit
          timeout 45s ./godot --headless --path . --script tests/update_smoke.gd
          timeout 45s ./godot --headless --path . --script tests/self_reliance_smoke.gd
          timeout 45s ./godot --headless --path . --script tests/voice_smoke.gd
          echo AURORA_RELEASE_DISCIPLINE_GATES_OK

      - name: Commit migration only after green gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuroraFox Migration Bot'
          git config user.email 'aurorafox-migration@users.noreply.github.com'
          git add update/update_manager.gd tests/update_smoke.gd build/set_version.ps1 .github/workflows/release.yml .github/workflows/voice-ci.yml .github/workflows/verified-version-finalize.yml docs/PROJECT_MASTER_LOG.md docs/VERSIONING_POLICY.md tests/test_release_channel_contract.py project/release_request.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Migration already applied.'
            exit 0
          fi
          base="$(git rev-parse HEAD)"
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          if [ "$base" != "$remote" ]; then
            echo "main advanced during verification ($base -> $remote); refusing an untested rebase" >&2
            exit 2
          fi
          git commit -m 'release: harden stable update channel and verified versioning'
          git push origin HEAD:main
