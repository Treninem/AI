name: AuroraFox Knowledge Wave-B Large Stress

on:
  pull_request:
    paths:
      - 'benchmarks/knowledge/large_import_pressure_probe.gd'
      - 'benchmarks/knowledge/large_remove_pressure_probe.gd'
      - 'benchmarks/knowledge/run_large_pressure.py'
      - 'benchmarks/knowledge/run_memory_scaling.py'
      - 'benchmarks/knowledge/run_search_scaling.py'
      - 'benchmarks/knowledge/run_registry_scaling.py'
      - 'benchmarks/knowledge/validate_performance_report.py'
      - 'tests/test_knowledge_large_pressure_contract.py'
      - '.github/workflows/knowledge-wave-b-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurorafox-knowledge-wave-b-large-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  large-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Validate large-pressure contract
        run: python -m unittest tests.test_knowledge_large_pressure_contract -v

      - name: Compile pressure and scaling runners
        run: >-
          python -m py_compile
          benchmarks/knowledge/run_large_pressure.py
          benchmarks/knowledge/run_memory_scaling.py
          benchmarks/knowledge/run_search_scaling.py
          benchmarks/knowledge/run_registry_scaling.py
          benchmarks/knowledge/validate_performance_report.py

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
          ./godot --version

      - name: Import and parse project
        run: timeout 120s ./godot --headless --editor --path . --quit

      - name: Run 10-50-100-250 MiB import restart removal pressure
        run: >-
          python benchmarks/knowledge/run_large_pressure.py
          --godot ./godot
          --sizes-mb 10,50,100,250
          --timeout-seconds 600
          --report artifacts/knowledge-performance/wave-b-large-pressure.json

      - name: Verify 100 MiB rollback and restart
        run: >-
          python benchmarks/knowledge/run_knowledge_benchmark_portable.py
          --godot ./godot
          --scenario rollback
          --target-mb 100
          --timeout-seconds 600
          --report artifacts/knowledge-performance/wave-b-rollback-100mb.json

      - name: Validate rollback evidence
        run: >-
          python benchmarks/knowledge/validate_performance_report.py
          artifacts/knowledge-performance/wave-b-rollback-100mb.json
          --output artifacts/knowledge-performance/wave-b-rollback-100mb-gate.json

      - name: Measure MemoryStore 250-500-1000
        run: >-
          python benchmarks/knowledge/run_memory_scaling.py
          --godot ./godot
          --counts 250,500,1000
          --timeout-seconds 600
          --report artifacts/knowledge-performance/wave-b-memory-scaling.json

      - name: Measure Knowledge search 4-8-16 MiB
        run: >-
          python benchmarks/knowledge/run_search_scaling.py
          --godot ./godot
          --sizes-mb 4,8,16
          --timeout-seconds 600
          --report artifacts/knowledge-performance/wave-b-search-scaling.json

      - name: Measure registry 32-64-128
        run: >-
          python benchmarks/knowledge/run_registry_scaling.py
          --godot ./godot
          --counts 32,64,128
          --source-kb 4
          --timeout-seconds 300
          --report artifacts/knowledge-performance/wave-b-registry-scaling.json

      - name: Enforce Wave-B relative performance blockers
        run: >-
          python benchmarks/knowledge/validate_performance_report.py
          artifacts/knowledge-performance/wave-b-memory-scaling.json
          artifacts/knowledge-performance/wave-b-search-scaling.json
          artifacts/knowledge-performance/wave-b-registry-scaling.json
          --enforce-performance
          --output artifacts/knowledge-performance/wave-b-relative-gate.json

      - name: Upload Wave-B large evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-wave-b-large-${{ github.sha }}
          path: artifacts/knowledge-performance/
          if-no-files-found: error
