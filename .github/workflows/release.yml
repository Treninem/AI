name: AuroraFox Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Godot 4.7.1 and export templates
        id: godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot/releases/download/4.7.1-stable'
          New-Item -ItemType Directory -Force .ci\godot,.ci\templates | Out-Null
          Invoke-WebRequest "$base/Godot_v4.7.1-stable_win64.exe.zip" -OutFile .ci\godot.zip
          Expand-Archive .ci\godot.zip .ci\godot -Force
          $godot = (Get-ChildItem .ci\godot -Filter '*_console.exe' | Select-Object -First 1).FullName
          if (-not $godot) { $godot = (Get-ChildItem .ci\godot -Filter '*.exe' | Select-Object -First 1).FullName }
          if (-not $godot) { throw 'Godot executable not found' }
          Invoke-WebRequest "$base/Godot_v4.7.1-stable_export_templates.tpz" -OutFile .ci\templates.tpz
          Copy-Item .ci\templates.tpz .ci\templates.zip
          Expand-Archive .ci\templates.zip .ci\templates -Force
          $dest = Join-Path $env:APPDATA 'Godot\export_templates\4.7.1.stable'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $source = Join-Path (Resolve-Path .ci\templates).Path 'templates'
          Copy-Item "$source\*" $dest -Recurse -Force
          "path=$godot" >> $env:GITHUB_OUTPUT

      - name: Verify project and platform versions
        shell: pwsh
        run: |
          .\tests\version_sync_test.ps1
          $text = Get-Content project.godot -Raw
          if ($text -notmatch 'config/version="([0-9.]+)"') { throw 'application/config/version missing' }
          $version = $Matches[1]
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'.TrimStart('v')
            if ($tag -ne $version) { throw "Tag $tag does not match project version $version" }
          }

      - name: Import project on Windows
        shell: pwsh
        run: |
          & '${{ steps.godot.outputs.path }}' --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot project import failed on Windows' }

      - name: Build Windows core package
        shell: pwsh
        run: |
          .\build\build_windows.ps1 -Godot '${{ steps.godot.outputs.path }}' -SkipModelSetup -SkipVoiceSetup

      - name: Smoke exported Windows executable
        shell: pwsh
        run: |
          $exe = '.\build\windows\AuroraFox.exe'
          if (-not (Test-Path $exe)) { throw 'AuroraFox.exe was not produced' }
          $p = Start-Process -FilePath $exe -ArgumentList @('--headless','--quit-after','3') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Exported AuroraFox.exe exited with $($p.ExitCode)" }

      - name: Create Windows updater ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\* -DestinationPath dist\AuroraFox-Windows.zip -CompressionLevel Optimal -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $text = Get-Content project.godot -Raw
          $null = $text -match 'config/version="([0-9.]+)"'
          $version = $Matches[1]
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc "/DMyAppVersion=$version" build\AuroraFox.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          if (-not (Test-Path build\release\AuroraFox_Setup_Windows.exe)) { throw 'Installer was not produced' }
          Copy-Item build\release\AuroraFox_Setup_Windows.exe dist\AuroraFox_Setup_Windows.exe -Force

      - name: Silent install, launch and uninstall Windows release
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'AuroraFoxReleaseInstalled'
          $installer = (Resolve-Path 'build\release\AuroraFox_Setup_Windows.exe').Path
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -PassThru -Wait
          if ($install.ExitCode -notin @(0,3010)) { throw "Installer exited with $($install.ExitCode)" }
          $exe = Join-Path $installDir 'AuroraFox.exe'
          if (-not (Test-Path $exe)) { throw 'Installed AuroraFox.exe is missing' }
          $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--quit-after','3') -PassThru -Wait
          if ($run.ExitCode -ne 0) { throw "Installed AuroraFox.exe exited with $($run.ExitCode)" }
          $uninstaller = Get-ChildItem $installDir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller is missing' }
          $un = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($un.ExitCode -ne 0) { throw "Uninstaller exited with $($un.ExitCode)" }
          Write-Host 'AURORA_WINDOWS_INSTALL_SMOKE_OK' -ForegroundColor Green

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurorafox-windows
          path: |
            dist/AuroraFox-Windows.zip
            dist/AuroraFox_Setup_Windows.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android release contract
        shell: bash
        run: python3 tests/test_android_contract.py

      - name: Resolve canonical Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          numeric="$(python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('project/version.json').read_text(encoding='utf-8'))
          numeric = str(state.get('numeric', '')).strip()
          if not numeric or len(numeric.split('.')) != 4:
              raise SystemExit('project/version.json has invalid numeric version')
          print(numeric)
          PY
          )"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            tag="${GITHUB_REF_NAME#v}"
            test "$tag" = "$numeric" || { echo "Tag $tag != project version $numeric" >&2; exit 1; }
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 / NDK r28b / CMake 3.22.1
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.22.1" "ndk;28.1.13356709"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.1 and export templates
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/godotengine/godot/releases/download/4.7.1-stable'
          mkdir -p .ci/godot "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          curl -fL "$base/Godot_v4.7.1-stable_linux.x86_64.zip" -o .ci/godot.zip
          unzip -q .ci/godot.zip -d .ci/godot
          godot="$(find .ci/godot -maxdepth 1 -type f -name 'Godot*' | head -n1)"
          test -n "$godot"
          chmod +x "$godot"
          curl -fL "$base/Godot_v4.7.1-stable_export_templates.tpz" -o .ci/templates.zip
          rm -rf .ci/templates && mkdir -p .ci/templates
          unzip -q .ci/templates.zip -d .ci/templates
          cp -R .ci/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          echo "path=$godot" >> "$GITHUB_OUTPUT"

      - name: Install release-test Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            -r api/requirements.txt \
            pytest==8.4.1 numpy==2.2.6 \
            requests==2.32.5 pypdf==6.14.2 python-docx==1.2.0 \
            openpyxl==3.1.5 xlrd==2.0.2 python-pptx==1.0.2

      - name: Run Python API, privacy, voice and file gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q agent api voice/python file_intelligence tests
          PYTHONPATH="$PWD" python3 -m pytest -q \
            tests/test_api_gateway.py \
            tests/test_api_privacy_contract.py \
            tests/test_voice_configs.py \
            tests/test_xtts_contract.py \
            tests/test_file_intelligence.py \
            tests/test_project_index.py

      - name: Import project and run Godot core gates
        shell: bash
        run: |
          set -euo pipefail
          godot='${{ steps.godot.outputs.path }}'
          timeout 90s "$godot" --headless --editor --path . --quit
          for script in \
            tests/voice_smoke.gd \
            tests/chat_context_smoke.gd \
            tests/semantic_memory_smoke.gd \
            tests/work_mode_store_smoke.gd \
            tests/work_mode_smoke.gd \
            tests/desktop_ui_smoke.gd \
            tests/api_gateway_smoke.gd \
            tests/autonomous_coordinator_smoke.gd \
            tests/self_improver_smoke.gd \
            tests/runtime_extension_smoke.gd \
            tests/update_smoke.gd
          do
            test -f "$script"
            echo "Running $script"
            timeout 45s "$godot" --headless --path . --script "$script"
          done
          echo 'AURORA_CORE_RELEASE_GATES_OK'

      - name: Require stable Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.AURORA_ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.AURORA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_USER" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo 'Android release signing secrets are required so every update uses the same signing identity.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aurorafox-release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/aurorafox-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_USER" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Android plugin and signed APK
        shell: pwsh
        run: |
          ./build/build_android.ps1 -Godot '${{ steps.godot.outputs.path }}' -Gradle 'gradle'

      - name: Collect and validate signed Android artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk='build/android/AuroraFox.apk'
          test -s "$apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee build/android/release-signature.txt
          "$AAPT" dump badging "$apk" | tee build/android/release-badging.txt
          version='${{ steps.version.outputs.numeric }}'
          grep -q "package: name='com.aurorafox.ai'" build/android/release-badging.txt
          grep -q "versionName='${version}'" build/android/release-badging.txt
          grep -q "sdkVersion:'26'" build/android/release-badging.txt
          grep -q "targetSdkVersion:'35'" build/android/release-badging.txt
          test "$(stat -c%s "$apk")" -gt 1048576
          sha256sum "$apk" | tee build/android/release-sha256.txt
          cp "$apk" dist/AuroraFox-Android.apk

      - name: Enable KVM when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo 'KVM is unavailable on this runner; emulator runner may use software acceleration.'
          fi

      - name: Install and launch signed APK on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            apk='dist/AuroraFox-Android.apk'
            adb install -r "$apk"
            adb shell pm path com.aurorafox.ai | tee build/android/release-emulator-package.txt
            grep -q '^package:' build/android/release-emulator-package.txt
            adb shell monkey -p com.aurorafox.ai -c android.intent.category.LAUNCHER 1
            sleep 8
            pid="$(adb shell pidof com.aurorafox.ai | tr -d '\r')"
            test -n "$pid"
            adb shell dumpsys package com.aurorafox.ai | grep -F "versionName=${{ steps.version.outputs.numeric }}"
            adb logcat -d -v brief > build/android/release-emulator-logcat.txt
            if grep -A10 -B4 'FATAL EXCEPTION' build/android/release-emulator-logcat.txt | grep -q 'com.aurorafox.ai'; then
              echo 'Signed AuroraFox APK crashed during Android release smoke.' >&2
              grep -A20 -B6 'FATAL EXCEPTION' build/android/release-emulator-logcat.txt | tail -n 120 >&2
              exit 1
            fi
            echo "AURORA_ANDROID_RELEASE_EMULATOR_OK pid=$pid"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurorafox-android
          path: dist/AuroraFox-Android.apk
          if-no-files-found: error

      - name: Upload Android diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: aurorafox-android-diagnostics
          path: |
            build/android/release-signature.txt
            build/android/release-badging.txt
            build/android/release-sha256.txt
            build/android/release-emulator-package.txt
            build/android/release-emulator-logcat.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: aurorafox-windows
          path: dist

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: aurorafox-android
          path: dist

      - name: Generate verified update manifest and release evidence
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          win='dist/AuroraFox-Windows.zip'
          apk='dist/AuroraFox-Android.apk'
          win_sha="$(sha256sum "$win" | awk '{print $1}')"
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          win_size="$(stat -c%s "$win")"
          apk_size="$(stat -c%s "$apk")"
          python3 - "$version" "$win_sha" "$apk_sha" "$win_size" "$apk_size" "$GITHUB_SHA" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          version, win_sha, apk_sha, win_size, apk_size, commit = sys.argv[1:]
          tag = 'v' + version
          base = f'https://github.com/${{ github.repository }}/releases/download/{tag}'
          now = datetime.now(timezone.utc).isoformat()
          manifest = {
              'version': version,
              'channel': 'stable',
              'mandatory': False,
              'published_at': now,
              'notes': f'AuroraFox {version}',
              'assets': {
                  'windows': {'url': base + '/AuroraFox-Windows.zip', 'sha256': win_sha, 'size': int(win_size), 'format': 'zip'},
                  'android': {'url': base + '/AuroraFox-Android.apk', 'sha256': apk_sha, 'size': int(apk_size), 'format': 'apk'},
              },
          }
          evidence = {
              'schema_version': 1,
              'verified': True,
              'version': 'V' + version,
              'commit': commit,
              'verified_at': now,
              'passed_gates': [
                  'android_apk', 'android_emulator', 'windows_package', 'windows_install',
                  'voice_core', 'api_gateway', 'api_privacy', 'semantic_memory',
                  'work_mode', 'updater',
              ],
              'artifacts': {
                  'windows_sha256': win_sha,
                  'android_sha256': apk_sha,
              },
          }
          Path('dist/update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('dist/release_verification.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cat dist/update.json
          cat dist/release_verification.json

      - name: Sign update manifest with pinned AuroraFox release key
        env:
          UPDATE_KEY_B64: ${{ secrets.AURORA_UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -f update/release_public.pub || { echo 'update/release_public.pub is missing. Run build/create_update_signing_key.ps1 and commit only the public key.' >&2; exit 1; }
          test -n "$UPDATE_KEY_B64" || { echo 'AURORA_UPDATE_SIGNING_PRIVATE_KEY_BASE64 secret is missing.' >&2; exit 1; }
          key="$RUNNER_TEMP/aurora-update-signing-private.pem"
          derived="$RUNNER_TEMP/aurora-update-derived-public.pem"
          printf '%s' "$UPDATE_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -pubout -out "$derived"
          committed_fp="$(openssl pkey -pubin -in update/release_public.pub -outform DER | sha256sum | awk '{print $1}')"
          derived_fp="$(openssl pkey -pubin -in "$derived" -outform DER | sha256sum | awk '{print $1}')"
          test "$committed_fp" = "$derived_fp" || { echo 'Update signing private key does not match pinned public key.' >&2; exit 1; }
          openssl dgst -sha256 -sign "$key" -out dist/update.sig dist/update.json
          openssl dgst -sha256 -verify update/release_public.pub -signature dist/update.sig dist/update.json
          rm -f "$key" "$derived"
          echo "Signed update.json with pinned key fingerprint $committed_fp"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" \
            dist/AuroraFox-Windows.zip \
            dist/AuroraFox_Setup_Windows.exe \
            dist/AuroraFox-Android.apk \
            dist/update.json \
            dist/update.sig \
            dist/release_verification.json \
            --title "AuroraFox $tag" \
            --generate-notes \
            --draft

      - name: Record verified release evidence on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="V${GITHUB_REF_NAME#v}"
          git config user.name 'AuroraFox Release Bot'
          git config user.email 'aurorafox-release@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          current="$(python3 - <<'PY'
          import json
          print(json.load(open('project/version.json', encoding='utf-8'))['version'])
          PY
          )"
          if [ "$current" != "$version" ]; then
            echo "main moved to $current while verified tag is $version; refusing to write stale readiness evidence" >&2
            exit 1
          fi
          mkdir -p agent/state
          cp dist/release_verification.json agent/state/release_verification.json
          git add -f agent/state/release_verification.json
          git commit -m "release: record verified ${version}" || true
          git push origin main

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false
