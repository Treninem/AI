name: AuroraFox Chat Learning Attachments CI

on:
  pull_request:
    paths:
      - 'scripts/attachment_manager.gd'
      - 'scripts/main.gd'
      - 'scripts/experience_store.gd'
      - 'scripts/knowledge_store.gd'
      - 'scripts/knowledge_import_transaction.gd'
      - 'tests/chat_learning_attachment_smoke.gd'
      - 'tests/test_chat_learning_attachment_contract.py'
      - '.github/workflows/chat-learning-attachments-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/attachment_manager.gd'
      - 'scripts/main.gd'
      - 'scripts/experience_store.gd'
      - 'scripts/knowledge_store.gd'
      - 'scripts/knowledge_import_transaction.gd'
      - 'tests/chat_learning_attachment_smoke.gd'
      - 'tests/test_chat_learning_attachment_contract.py'
      - '.github/workflows/chat-learning-attachments-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurorafox-chat-learning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-learning-attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CHAT_LEARNING_HEAD_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install contract test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Run chat learning attachment contract
        run: python -m pytest -q tests/test_chat_learning_attachment_contract.py

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
          ./godot --version

      - name: Parse integrated project
        run: timeout 90s ./godot --headless --editor --path . --quit

      - name: Prove chat attachment import into Knowledge Training and Skills
        run: timeout 120s ./godot --headless --path . --script tests/chat_learning_attachment_smoke.gd
