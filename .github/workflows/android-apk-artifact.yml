name: AuroraFox Android APK Artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android_plugin/**'
      - 'addons/AuroraFoxRuntime/**'
      - 'build/build_android.ps1'
      - 'export_presets.cfg'
      - 'project.godot'
      - 'project/version.json'
      - 'scripts/ai_client.gd'
      - 'scripts/android_first_run.gd'
      - 'tests/test_android_contract.py'
      - '.github/workflows/android-apk-artifact.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android release contract
        shell: bash
        run: python3 tests/test_android_contract.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.1' \
            'cmake;3.22.1' \
            'ndk;28.1.13356709'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/godotengine/godot/releases/download/4.7.1-stable'
          mkdir -p .ci/godot .ci/templates
          curl -fL "$base/Godot_v4.7.1-stable_linux.x86_64.zip" -o .ci/godot.zip
          unzip -q .ci/godot.zip -d .ci/godot
          GODOT="$(find .ci/godot -maxdepth 1 -type f -name 'Godot*' | head -n1)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          curl -fL "$base/Godot_v4.7.1-stable_export_templates.tpz" -o .ci/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q .ci/templates.tpz -d .ci/templates
          cp -a .ci/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Resolve canonical AuroraFox version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          numeric="$(python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('project/version.json').read_text(encoding='utf-8'))
          numeric = str(state.get('numeric', '')).strip()
          if not numeric or len(numeric.split('.')) != 4:
              raise SystemExit('project/version.json has invalid numeric version')
          print(numeric)
          PY
          )"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "AuroraFox Android version: $numeric"

      - name: Build unsigned AuroraFox release APK
        shell: pwsh
        run: ./build/build_android.ps1 -Godot "$env:GODOT" -Gradle 'gradle' -ReleaseOnly -AllowUnsignedRelease

      - name: Sign and validate installable APK
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.numeric }}'
          raw='build/android/AuroraFox.apk'
          aligned='build/android/AuroraFox-aligned.apk'
          final="build/android/AuroraFox-V${version}-Android-Test.apk"
          test -s "$raw"

          KS="$RUNNER_TEMP/aurorafox-test.keystore"
          keytool -genkeypair \
            -keystore "$KS" \
            -storepass aurorafox \
            -keypass aurorafox \
            -alias aurorafox-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname 'CN=AuroraFox Test, O=AuroraFox, C=RU'

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$APKSIGNER" && test -n "$ZIPALIGN" && test -n "$AAPT"

          "$ZIPALIGN" -f -p 4 "$raw" "$aligned"
          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-key-alias aurorafox-test \
            --ks-pass pass:aurorafox \
            --key-pass pass:aurorafox \
            --out "$final" \
            "$aligned"
          "$APKSIGNER" verify --verbose --print-certs "$final"
          "$AAPT" dump badging "$final" | tee build/android/aapt-badging.txt
          grep -q "package: name='com.aurorafox.ai'" build/android/aapt-badging.txt
          grep -q "versionName='${version}'" build/android/aapt-badging.txt
          grep -q "sdkVersion:'26'" build/android/aapt-badging.txt
          grep -q "targetSdkVersion:'35'" build/android/aapt-badging.txt
          test "$(stat -c%s "$final")" -gt 1048576

          sha256sum "$final" | tee build/android/SHA256SUMS.txt
          echo "APK_PATH=$final" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            adb install -r "$APK_PATH"
            adb shell pm path com.aurorafox.ai | tee build/android/emulator-package.txt
            grep -q '^package:' build/android/emulator-package.txt
            adb shell monkey -p com.aurorafox.ai -c android.intent.category.LAUNCHER 1
            sleep 8
            pid="$(adb shell pidof com.aurorafox.ai | tr -d '\r')"
            test -n "$pid"
            adb shell dumpsys package com.aurorafox.ai | grep -F "versionName=${{ steps.version.outputs.numeric }}"
            adb logcat -d -v brief > build/android/emulator-logcat.txt
            if grep -A10 -B4 'FATAL EXCEPTION' build/android/emulator-logcat.txt | grep -q 'com.aurorafox.ai'; then
              echo 'AuroraFox crashed during Android launch smoke.' >&2
              grep -A20 -B6 'FATAL EXCEPTION' build/android/emulator-logcat.txt | tail -n 120 >&2
              exit 1
            fi
            echo "AURORA_ANDROID_EMULATOR_OK pid=$pid"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraFox-V${{ steps.version.outputs.numeric }}-Android-Test
          path: |
            ${{ env.APK_PATH }}
            build/android/SHA256SUMS.txt
            build/android/aapt-badging.txt
            build/android/emulator-package.txt
            build/android/emulator-logcat.txt
          if-no-files-found: error
