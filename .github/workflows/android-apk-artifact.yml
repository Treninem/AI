name: AuroraFox Android APK Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1'
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          ls -la "$SDK_ROOT/ndk" || true
          NDK_VERSION="$(ls -1 "$SDK_ROOT/ndk" 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$NDK_VERSION" ]; then
            "$SDKMANAGER" 'ndk;28.0.13004108'
            NDK_VERSION='28.0.13004108'
          fi
          echo "AURORA_NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
          echo "Using Android SDK $SDK_ROOT, NDK $NDK_VERSION"

      - name: Pin plugin to installed NDK
        shell: python
        run: |
          from pathlib import Path
          import os
          path = Path('android_plugin/plugin/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          marker = '    compileSdk = 35\n'
          ndk = os.environ['AURORA_NDK_VERSION']
          if 'ndkVersion =' not in text:
              text = text.replace(marker, marker + f'    ndkVersion = "{ndk}"\n', 1)
          path.write_text(text, encoding='utf-8')

      - name: Download Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/godotengine/godot/releases/download/4.7.1-stable'
          mkdir -p .ci/godot .ci/templates
          curl -fL "$base/Godot_v4.7.1-stable_linux.x86_64.zip" -o .ci/godot.zip
          unzip -q .ci/godot.zip -d .ci/godot
          GODOT="$(find .ci/godot -maxdepth 1 -type f -name 'Godot*' | head -n1)"
          chmod +x "$GODOT"
          curl -fL "$base/Godot_v4.7.1-stable_export_templates.tpz" -o .ci/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q .ci/templates.tpz -d .ci/templates
          cp -a .ci/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Build AuroraFox Android release APK
        shell: pwsh
        run: ./build/build_android.ps1 -Godot "$env:GODOT" -ReleaseOnly -AllowUnsignedRelease

      - name: Test-sign APK for installation artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='build/android/AuroraFox.apk'
          test -f "$APK"
          KS="$RUNNER_TEMP/aurorafox-test.keystore"
          keytool -genkeypair -keystore "$KS" -storepass aurorafox -keypass aurorafox -alias aurorafox-test -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=AuroraFox Test, O=AuroraFox, C=RU'
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          test -n "$APKSIGNER" && test -n "$ZIPALIGN"
          "$ZIPALIGN" -f 4 "$APK" build/android/AuroraFox-aligned.apk
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias aurorafox-test --ks-pass pass:aurorafox --key-pass pass:aurorafox --out build/android/AuroraFox-V1.0.0.0-Android-Test.apk build/android/AuroraFox-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs build/android/AuroraFox-V1.0.0.0-Android-Test.apk

      - name: SHA-256
        shell: bash
        run: sha256sum build/android/AuroraFox-V1.0.0.0-Android-Test.apk | tee build/android/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraFox-V1.0.0.0-Android-Test
          path: |
            build/android/AuroraFox-V1.0.0.0-Android-Test.apk
            build/android/SHA256SUMS.txt
          if-no-files-found: error
