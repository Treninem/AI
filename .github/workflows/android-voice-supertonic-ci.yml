name: AuroraFox Android Voice Supertonic

on:
  workflow_dispatch:
  push:
    branches:
      - chat-2026-09-17-voice-audio-r2
    paths:
      - 'android_plugin/plugin/src/main/java/com/aurorafox/runtime/AndroidVoiceRuntime.kt'
      - 'android_plugin/setup_native.ps1'
      - 'tests/test_android_voice_supertonic_contract.py'
      - '.github/workflows/android-voice-supertonic-ci.yml'
  pull_request:
    paths:
      - 'android_plugin/plugin/src/main/java/com/aurorafox/runtime/AndroidVoiceRuntime.kt'
      - 'android_plugin/setup_native.ps1'
      - 'tests/test_android_voice_supertonic_contract.py'
      - '.github/workflows/android-voice-supertonic-ci.yml'

permissions:
  contents: read

concurrency:
  group: aurorafox-android-voice-supertonic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-voice-supertonic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static Android Voice contract
        shell: bash
        run: python3 tests/test_android_voice_supertonic_contract.py

      - name: Verify official Supertonic asset identity and layout
        shell: bash
        run: |
          set -euo pipefail
          name='sherpa-onnx-supertonic-3-tts-int8-2026-05-11'
          archive="${RUNNER_TEMP}/${name}.tar.bz2"
          url="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${name}.tar.bz2"
          expected_bytes='128774318'
          expected_sha='82fa96f91c4ef8abaae3a14a3f4153facf88bed821d1f7331cec2700f432c427'
          curl --retry 4 --retry-all-errors -fL "$url" -o "$archive"
          actual_bytes="$(stat -c '%s' "$archive")"
          actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual_bytes" = "$expected_bytes"
          test "$actual_sha" = "$expected_sha"
          listing="${RUNNER_TEMP}/supertonic-files.txt"
          tar -tjf "$archive" > "$listing"
          for required in \
            duration_predictor.int8.onnx \
            text_encoder.int8.onnx \
            vector_estimator.int8.onnx \
            vocoder.int8.onnx \
            tts.json \
            unicode_indexer.bin \
            voice.bin; do
            grep -Eq "(^|/)${required}$" "$listing"
          done
          echo "SUPERTONIC_ASSET_OK bytes=${actual_bytes} sha256=${actual_sha}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android compile platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'

      - name: Stage verified sherpa-onnx 1.13.4 compile AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android_plugin/plugin/libs
          curl --retry 4 --retry-all-errors -fL \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar' \
            -o android_plugin/plugin/libs/sherpa-onnx-1.13.4.aar
          test -s android_plugin/plugin/libs/sherpa-onnx-1.13.4.aar

      - name: Compile Android Voice Kotlin against sherpa-onnx 1.13.4
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android_plugin :plugin:compileDebugKotlin --no-daemon --stacktrace
