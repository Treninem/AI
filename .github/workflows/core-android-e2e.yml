name: AuroraFox Core Android E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/core/android_godot_benchmark.gd'
      - 'benchmarks/core/android_godot_benchmark.tscn'
      - 'tests/test_core_android_e2e_contract.py'
      - 'scripts/ai_client.gd'
      - 'scripts/aurora_core_runtime.gd'
      - 'scripts/android_local_runtime.gd'
      - 'scripts/bundled_core_model.gd'
      - 'android_plugin/**'
      - 'build/build_android.ps1'
      - 'build/prepare_bundled_core_model.ps1'
      - '.github/workflows/core-android-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/core/android_godot_benchmark.gd'
      - 'benchmarks/core/android_godot_benchmark.tscn'
      - 'tests/test_core_android_e2e_contract.py'
      - 'scripts/ai_client.gd'
      - 'scripts/aurora_core_runtime.gd'
      - 'scripts/android_local_runtime.gd'
      - 'scripts/bundled_core_model.gd'
      - 'android_plugin/**'
      - 'build/build_android.ps1'
      - 'build/prepare_bundled_core_model.ps1'
      - '.github/workflows/core-android-e2e.yml'

permissions:
  contents: read

concurrency:
  group: aurorafox-core-android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_core_android_e2e_contract.py

      - name: Download Godot 4.7.1 for parse gate
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/godotengine/godot/releases/download/4.7.1-stable'
          mkdir -p .ci/godot
          curl --retry 4 --retry-all-errors -fL "$base/Godot_v4.7.1-stable_linux.x86_64.zip" -o .ci/godot.zip
          unzip -qo .ci/godot.zip -d .ci/godot
          GODOT="$(find .ci/godot -maxdepth 1 -type f -name 'Godot*' | head -n1)"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Import project and parse Android normal-path benchmark
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --check-only --script benchmarks/core/android_godot_benchmark.gd

  real-normal-path-android:
    needs: contract-and-parse
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AURORAFOX_NATIVE_CACHE_DIR: ${{ github.workspace }}/.ci/native-cache
      CORE_CACHE_DIR: ${{ github.workspace }}/.ci/core-model-cache
      CORE_SHA: d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.1' \
            'cmake;3.22.1' \
            'ndk;28.1.13356709'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/godotengine/godot/releases/download/4.7.1-stable'
          mkdir -p .ci/godot .ci/templates
          curl --retry 4 --retry-all-errors -fL "$base/Godot_v4.7.1-stable_linux.x86_64.zip" -o .ci/godot.zip
          unzip -qo .ci/godot.zip -d .ci/godot
          GODOT="$(find .ci/godot -maxdepth 1 -type f -name 'Godot*' | head -n1)"
          chmod +x "$GODOT"
          template_dir="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$template_dir"
          curl --retry 4 --retry-all-errors -fL "$base/Godot_v4.7.1-stable_export_templates.tpz" -o .ci/templates.tpz
          unzip -q .ci/templates.tpz -d .ci/templates
          cp -a .ci/templates/templates/. "$template_dir/"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Restore verified Core model cache
        id: model_cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/core-model-cache
          key: aurorafox-core-android-v1-d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5

      - name: Restore pinned Android native cache
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci/native-cache
            android_plugin/plugin/src/main/cpp/third_party
            android_plugin/plugin/libs
            android_plugin/plugin/src/main/assets/voice
          key: aurorafox-android-native-v1-llama-6d054983-wasm3-2f3123df-sherpa-1.13.4

      - name: Select benchmark scene only in disposable CI checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('project.godot')
          text = path.read_text(encoding='utf-8')
          old = 'run/main_scene="res://main.tscn"'
          new = 'run/main_scene="res://benchmarks/core/android_godot_benchmark.tscn"'
          if text.count(old) != 1:
              raise SystemExit('canonical main scene declaration changed; refusing implicit benchmark rewrite')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          grep -F 'run/main_scene="res://benchmarks/core/android_godot_benchmark.tscn"' project.godot

      - name: Build disposable benchmark APK with production Core/runtime
        shell: pwsh
        run: |
          ./build/build_android.ps1 -Godot "$env:GODOT" -Gradle 'gradle' -ReleaseOnly -AllowUnsignedRelease -CoreModelCacheDir $env:CORE_CACHE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Android normal-path benchmark APK build failed' }

      - name: Save verified Core model cache
        if: steps.model_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/core-model-cache
          key: ${{ steps.model_cache.outputs.cache-primary-key }}

      - name: Save pinned Android native cache
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/native-cache
            android_plugin/plugin/src/main/cpp/third_party
            android_plugin/plugin/libs
            android_plugin/plugin/src/main/assets/voice
          key: ${{ steps.native_cache.outputs.cache-primary-key }}

      - name: Test-sign disposable benchmark APK
        shell: bash
        run: |
          set -euo pipefail
          raw='build/android/AuroraFox.apk'
          aligned='build/android/AuroraFox-core-e2e-aligned.apk'
          final='build/android/AuroraFox-core-e2e.apk'
          test -s "$raw"
          KS="$RUNNER_TEMP/aurorafox-core-e2e.keystore"
          keytool -genkeypair -keystore "$KS" -storepass aurorafox -keypass aurorafox -alias core-e2e -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=AuroraFox Core E2E, O=AuroraFox, C=RU'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          "$ZIPALIGN" -f -p 4 "$raw" "$aligned"
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias core-e2e --ks-pass pass:aurorafox --key-pass pass:aurorafox --out "$final" "$aligned"
          "$APKSIGNER" verify --verbose "$final"
          echo "BENCHMARK_APK=$final" >> "$GITHUB_ENV"

      - name: Enable KVM when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Run AIClient normal path fully offline on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096
          script: |
            set -eu
            pkg='com.aurorafox.ai'
            mkdir -p artifacts
            adb install -r "$BENCHMARK_APK"
            adb shell cmd connectivity airplane-mode enable || true
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            sleep 2
            state="$(adb shell settings get global airplane_mode_on | tr -d '\r')"
            printf 'airplane_mode=%s\n' "$state" | tee artifacts/core-benchmark-android-e2e-network.txt
            test "$state" = '1'
            adb logcat -c
            adb shell am force-stop "$pkg"
            adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
            report_path=''
            i=0
            while [ "$i" -lt 240 ]; do
              report_path="$(adb shell run-as "$pkg" find files -name core-benchmark-android-e2e.json -print 2>/dev/null | tr -d '\r' | head -n1 || true)"
              if [ -n "$report_path" ]; then
                break
              fi
              sleep 5
              i=$((i + 1))
            done
            adb logcat -d -v brief > artifacts/core-benchmark-android-e2e-logcat.txt
            if [ -z "$report_path" ]; then
              echo 'Android AIClient E2E benchmark timed out after 1200 seconds.' >&2
              tail -n 500 artifacts/core-benchmark-android-e2e-logcat.txt >&2
              exit 1
            fi
            adb exec-out run-as "$pkg" cat "$report_path" > artifacts/core-benchmark-android-e2e.json
            python3 - <<'PY'
            import json
            from pathlib import Path
            data = json.loads(Path('artifacts/core-benchmark-android-e2e.json').read_text(encoding='utf-8'))
            required = {
                'offline_network_guard', 'bundled_core_identity', 'cold_start_first_response',
                'basic_reasoning', 'russian_dialog', 'multi_turn_context',
                'core_knowledge_retrieval', 'compatibility_switch_isolation'
            }
            rows = {row.get('id'): row for row in data.get('scenarios', []) if isinstance(row, dict)}
            failures = []
            if data.get('status') != 'completed' or data.get('passed') is not True: failures.append('overall')
            if data.get('platform') != 'Android': failures.append('platform')
            if data.get('environment', {}).get('external_network_probe_blocked') is not True: failures.append('network_probe')
            core = data.get('core', {})
            if core.get('prepared_sha256') != 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5': failures.append('model_sha')
            runtime_after = core.get('runtime_after', {})
            if runtime_after.get('last_runtime') != 'aurora_core_android': failures.append('runtime_after')
            if int(runtime_after.get('ollama_failures', -1)) != 0: failures.append('ollama_failures')
            if set(rows) < required: failures.append('missing_scenarios')
            if any(not bool(rows[name].get('passed', False)) for name in required if name in rows): failures.append('scenario_failure')
            if any(str(rows[name].get('runtime', '')) not in ('', 'aurora_core_android') for name in required if name in rows): failures.append('unexpected_runtime')
            perf = data.get('performance', {})
            if float(perf.get('cold_first_response_ms', 0) or 0) <= 0: failures.append('cold_measurement')
            if float(perf.get('warm_median_ms', 0) or 0) <= 0: failures.append('warm_measurement')
            if float(perf.get('suite_wall_ms', 0) or 0) <= 0: failures.append('wall_measurement')
            print(json.dumps(data, ensure_ascii=False, indent=2))
            if failures:
                raise SystemExit('AURORAFOX_ANDROID_NORMAL_PATH_GATE_FAILED: ' + ','.join(failures))
            print('AURORAFOX_ANDROID_NORMAL_PATH_GATE_OK')
            PY

      - name: Upload Android normal-path Core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurorafox-core-android-e2e-${{ github.sha }}
          path: |
            artifacts/core-benchmark-android-e2e.json
            artifacts/core-benchmark-android-e2e-logcat.txt
            artifacts/core-benchmark-android-e2e-network.txt
          if-no-files-found: warn
          retention-days: 30
