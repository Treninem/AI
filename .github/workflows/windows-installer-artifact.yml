name: AuroraFox Windows Installer Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Godot 4.7.1 and export templates
        id: godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot/releases/download/4.7.1-stable'
          New-Item -ItemType Directory -Force .ci\godot,.ci\templates | Out-Null
          Invoke-WebRequest "$base/Godot_v4.7.1-stable_win64.exe.zip" -OutFile .ci\godot.zip
          Expand-Archive .ci\godot.zip .ci\godot -Force
          $godot = (Get-ChildItem .ci\godot -Filter '*_console.exe' | Select-Object -First 1).FullName
          if (-not $godot) { $godot = (Get-ChildItem .ci\godot -Filter '*.exe' | Select-Object -First 1).FullName }
          if (-not $godot) { throw 'Godot executable not found' }
          Invoke-WebRequest "$base/Godot_v4.7.1-stable_export_templates.tpz" -OutFile .ci\templates.tpz
          Copy-Item .ci\templates.tpz .ci\templates.zip
          Expand-Archive .ci\templates.zip .ci\templates -Force
          $dest = Join-Path $env:APPDATA 'Godot\export_templates\4.7.1.stable'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $source = Join-Path (Resolve-Path .ci\templates).Path 'templates'
          Copy-Item "$source\*" $dest -Recurse -Force
          "path=$godot" >> $env:GITHUB_OUTPUT

      - name: Verify canonical version
        shell: pwsh
        run: .\tests\version_sync_test.ps1

      - name: Build Windows core package
        shell: pwsh
        run: .\build\build_windows.ps1 -Godot '${{ steps.godot.outputs.path }}' -SkipModelSetup -SkipVoiceSetup

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\* -DestinationPath dist\AuroraFox-V1.0.0.0-Windows-Portable.zip -CompressionLevel Optimal -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $versionState = Get-Content project\version.json -Raw | ConvertFrom-Json
          $version = [string]$versionState.numeric
          if ($version -ne '1.0.0.0') { throw "Unexpected installer version: $version" }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc "/DMyAppVersion=$version" build\AuroraFox.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Copy-Item build\release\AuroraFox_Setup_Windows.exe dist\AuroraFox-V1.0.0.0-Setup-Windows.exe -Force

      - name: Hash artifacts
        shell: pwsh
        run: |
          Get-FileHash dist\AuroraFox-V1.0.0.0-Setup-Windows.exe -Algorithm SHA256 | Format-List
          Get-FileHash dist\AuroraFox-V1.0.0.0-Windows-Portable.zip -Algorithm SHA256 | Format-List

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraFox-V1.0.0.0-Windows
          path: |
            dist/AuroraFox-V1.0.0.0-Setup-Windows.exe
            dist/AuroraFox-V1.0.0.0-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
