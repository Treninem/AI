name: Temporary Voice R2 Claim

on:
  push:
    branches: [chat-2026-09-17-voice-audio-r2]
    paths:
      - '.github/workflows/temp-voice-r2-claim.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-2026-09-17-voice-audio-r2
          fetch-depth: 0
      - name: Append takeover claim if missing
        shell: bash
        env:
          CLAIM_B64: 
        run: |
          set -euo pipefail
          log='docs/PROJECT_MASTER_LOG.md'
          if grep -Fq '### CLAIM `CHAT-2026-09-17-VOICE-AUDIO`' "$log"; then
            echo 'Voice takeover claim already present.'
            exit 0
          fi
          printf '%s' "$CLAIM_B64" | base64 --decode >> "$log"
          git config user.name 'aurorafox-voice-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$log"
          git commit -m 'coord: take over Voice Audio on fresh main'
          git push origin HEAD:chat-2026-09-17-voice-audio-r2
