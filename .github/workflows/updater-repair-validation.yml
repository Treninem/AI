name: AuroraFox Updater Repair Validation

on:
  workflow_run:
    workflows: ["AuroraFox Windows Package CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  validate-v13-repair:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact packaged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Windows package artifact from source run
        uses: actions/download-artifact@v4
        with:
          name: AuroraFox-Windows
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Restore packaged files as build/windows
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist -Filter 'AuroraFox-V*-Windows-Portable.zip' | Select-Object -First 1
          if (-not $portable) { throw 'Windows portable artifact is missing' }
          Remove-Item build\windows -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $portable.FullName build\windows -Force
          if (-not (Test-Path build\windows\AuroraFox.exe)) { throw 'Portable package does not contain AuroraFox.exe' }
          if (-not (Test-Path build\windows\update\release_public.pub)) { throw 'Signed-floor trust root is missing from Windows package' }
          $expected = (Get-Content update\release_public_fingerprint.sha256 -Raw).Split(' ',[System.StringSplitOptions]::RemoveEmptyEntries)[0].Trim().ToLowerInvariant()
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) { throw 'OpenSSL is required to verify the packaged update trust root' }
          $der = Join-Path $env:RUNNER_TEMP 'aurora-update-public.der'
          & $openssl.Source pkey -pubin -in build\windows\update\release_public.pub -outform DER -out $der
          if ($LASTEXITCODE -ne 0) { throw 'Could not parse packaged update public key' }
          $actual = (Get-FileHash $der -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Packaged update trust root mismatch: $actual != $expected" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Parse V1.3 repair smoke
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\tests\windows_v13_bridge_smoke.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'V1.3 repair smoke parse failed' }

      - name: Verify historical V1.3 to signed floor in-place repair
        shell: pwsh
        run: |
          $state = Get-Content project\version.json -Raw | ConvertFrom-Json
          $current = [string]$state.numeric
          $target = if ([version]$current -gt [version]'1.3.0.0') { $current } else { '1.4.0.0' }
          .\tests\windows_v13_bridge_smoke.ps1 -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -CandidateVersion $target

  normalize-and-publish-repairs:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    needs: validate-v13-repair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact packaged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download verified Windows package artifact
        uses: actions/download-artifact@v4
        with:
          name: AuroraFox-Windows
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Normalize repair releases away from stable latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in repair-v1.2-windows repair-v1.3-windows; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --prerelease --latest=false
            fi
          done

      - name: Publish permanent V1.2 and V1.3 repair assets after signed floor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          print(json.load(open('project/version.json', encoding='utf-8'))['numeric'])
          PY
          )"
          if ! python3 - "$version" <<'PY'
          import sys
          v=tuple(map(int,sys.argv[1].split('.')))
          raise SystemExit(0 if v > (1,3,0,0) else 20)
          PY
          then
            rc=$?
            if [ "$rc" -eq 20 ]; then
              echo 'Canonical version has not reached the signed floor yet; normalization only.'
              exit 0
            fi
            exit "$rc"
          fi

          source="dist/AuroraFox-V${version}-Setup-Windows.exe"
          test -s "$source"
          for old in 1.2 1.3; do
            stable="dist/AuroraFox-V${old}-Repair-Windows.exe"
            sums="dist/AuroraFox-V${old}-Repair-Windows-SHA256.txt"
            cp "$source" "$stable"
            sha256sum "$stable" | tee "$sums"
            tag="repair-v${old}-windows"
            notes="$RUNNER_TEMP/${tag}.md"
            cat > "$notes" <<EOF
          # AuroraFox V${old} Windows Repair Bridge

          Historical AuroraFox V${old} builds predate the permanent signed-update trust root.

          Run \`AuroraFox-V${old}-Repair-Windows.exe\` over the existing installation. The verified in-place bridge preserves Godot \`user://\` data and moves the installation to AuroraFox V${version}, the permanent signed-update line.

          This is a one-time repair and is deliberately a prerelease so it can never occupy the stable \`releases/latest\` updater endpoint.
          EOF
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$stable" "$sums" --clobber
              gh release edit "$tag" --title "AuroraFox V${old} Windows Repair Bridge" --notes-file "$notes" --prerelease --latest=false
            else
              gh release create "$tag" "$stable" "$sums" --title "AuroraFox V${old} Windows Repair Bridge" --notes-file "$notes" --prerelease --latest=false
            fi
          done
          echo "AURORA_REPAIR_RELEASES_READY signed_floor=$version"
