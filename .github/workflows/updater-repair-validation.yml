name: AuroraFox Updater Repair Validation

on:
  workflow_run:
    workflows: ["AuroraFox Windows Package CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  validate-legacy-repairs:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact packaged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Windows package artifact from source run
        uses: actions/download-artifact@v4
        with:
          name: AuroraFox-Windows
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Restore packaged files as build/windows
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist -Filter 'AuroraFox-V*-Windows-Portable.zip' | Select-Object -First 1
          if (-not $portable) { throw 'Windows portable artifact is missing' }
          Remove-Item build\windows -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $portable.FullName build\windows -Force
          if (-not (Test-Path build\windows\AuroraFox.exe)) { throw 'Portable package does not contain AuroraFox.exe' }
          if (-not (Test-Path build\windows\update\release_public.pub)) { throw 'Signed-floor trust root is missing from Windows package' }
          $expected = (Get-Content update\release_public_fingerprint.sha256 -Raw).Split(' ',[System.StringSplitOptions]::RemoveEmptyEntries)[0].Trim().ToLowerInvariant()
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) { throw 'OpenSSL is required to verify the packaged update trust root' }
          $der = Join-Path $env:RUNNER_TEMP 'aurora-update-public.der'
          & $openssl.Source pkey -pubin -in build\windows\update\release_public.pub -outform DER -out $der
          if ($LASTEXITCODE -ne 0) { throw 'Could not parse packaged update public key' }
          $actual = (Get-FileHash $der -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Packaged update trust root mismatch: $actual != $expected" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Parse V1.2 and V1.3 repair smokes
        shell: pwsh
        run: |
          foreach ($script in @('.\tests\windows_v12_bridge_smoke.ps1','.\tests\windows_v13_bridge_smoke.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$script :: $($_.Message)" }; throw "$script parse failed" }
          }

      - name: Verify historical V1.2 and V1.3 in-place trust-root repair
        shell: pwsh
        run: |
          $state = Get-Content project\version.json -Raw | ConvertFrom-Json
          $current = [string]$state.numeric
          $setup = Get-ChildItem dist -Filter 'AuroraFox-V*-Setup-Windows.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Current Windows setup artifact is missing' }
          .\tests\windows_v12_bridge_smoke.ps1 -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -CurrentInstaller $setup.FullName
          .\tests\windows_v13_bridge_smoke.ps1 -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -CandidateVersion $current

  normalize-and-publish-repairs:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    needs: validate-legacy-repairs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact packaged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download verified Windows package artifact
        uses: actions/download-artifact@v4
        with:
          name: AuroraFox-Windows
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Normalize existing repair releases away from stable latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in repair-v1.2-windows repair-v1.3-windows; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --prerelease --latest=false
            fi
          done

      - name: Check signed-floor repair publication eligibility
        id: floor
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          def ver(value):
              parts = tuple(int(p) for p in str(value).strip().lstrip('Vv').split('.'))
              if len(parts) != 4:
                  raise SystemExit(f'invalid four-part version: {value!r}')
              return parts

          state = json.loads(Path('project/version.json').read_text(encoding='utf-8'))
          identity = json.loads(Path('update/release_identity.json').read_text(encoding='utf-8'))
          current = str(state['numeric'])
          floor = str(identity['signed_update_floor'])
          legacy = str(identity['legacy_repair_required_through'])
          eligible = ver(current) >= ver(floor) and ver(current) > ver(legacy)
          with open(sys.argv[1], 'a', encoding='utf-8') as fh:
              fh.write(f'eligible={str(eligible).lower()}\n')
              fh.write(f'current={current}\n')
              fh.write(f'floor={floor}\n')
              fh.write(f'legacy={legacy}\n')
          print(f'AURORA_REPAIR_PUBLICATION_ELIGIBILITY current={current} floor={floor} legacy={legacy} eligible={eligible}')
          PY

      - name: Publish permanent V1.2 and V1.3 trust-root repair assets
        if: steps.floor.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.floor.outputs.current }}'
          floor='${{ steps.floor.outputs.floor }}'
          source="dist/AuroraFox-V${version}-Setup-Windows.exe"
          test -s "$source"
          for old in 1.2 1.3; do
            stable="dist/AuroraFox-V${old}-Repair-Windows.exe"
            sums="dist/AuroraFox-V${old}-Repair-Windows-SHA256.txt"
            cp "$source" "$stable"
            sha256sum "$stable" | tee "$sums"
            tag="repair-v${old}-windows"
            notes="$RUNNER_TEMP/${tag}.md"
            cat > "$notes" <<EOF
          # AuroraFox V${old} Windows Trust-Root Repair

          Historical AuroraFox V${old} Windows builds were produced before the permanent signed-update trust root was embedded in packaged applications.

          Run \`AuroraFox-V${old}-Repair-Windows.exe\` over the existing installation. The verified in-place bridge preserves Godot \`user://\` data and installs AuroraFox V${version} with the permanent update trust root. From the signed V${floor} floor onward, normal automatic updates use \`releases/latest/download/update.json\` plus RSA verification.

          This is a one-time repair and is deliberately a prerelease so it can never occupy the stable \`releases/latest\` updater endpoint.
          EOF
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$stable" "$sums" --clobber
              gh release edit "$tag" --title "AuroraFox V${old} Windows Trust-Root Repair" --notes-file "$notes" --prerelease --latest=false
            else
              gh release create "$tag" "$stable" "$sums" --title "AuroraFox V${old} Windows Trust-Root Repair" --notes-file "$notes" --prerelease --latest=false
            fi
          done
          echo "AURORA_REPAIR_RELEASES_READY bootstrap_version=$version signed_floor=$floor"

      - name: Verify repair tags cannot be stable latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          case "$latest" in
            repair-v1.2-windows|repair-v1.3-windows)
              echo "Repair release illegally occupies stable latest: $latest" >&2
              exit 1
              ;;
          esac
          for tag in repair-v1.2-windows repair-v1.3-windows; do
            if gh release view "$tag" >/dev/null 2>&1; then
              is_pre="$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')"
              test "$is_pre" = 'true' || { echo "$tag must be prerelease" >&2; exit 1; }
            fi
          done
          echo "AURORA_REPAIR_LATEST_ISOLATION_OK latest=${latest:-none}"
