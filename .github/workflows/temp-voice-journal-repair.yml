name: Temporary voice journal repair

on:
  push:
    branches:
      - chat-2026-09-17-voice-audio
    paths:
      - .github/workflows/temp-voice-journal-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-2026-09-17-voice-audio
          fetch-depth: 0
      - name: Restore inherited line exactly and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/PROJECT_MASTER_LOG.md')
          text = path.read_text(encoding='utf-8')
          old = '; иначе eliminate эти API/test diffs from the UI branch.'
          new = '; otherwise eliminate эти API/test diffs from the UI branch.'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one accidental phrase, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/temp-voice-journal-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PROJECT_MASTER_LOG.md .github/workflows/temp-voice-journal-repair.yml
          git diff --cached --check
          git diff --cached -- docs/PROJECT_MASTER_LOG.md
          git commit -m "docs: restore inherited master log wording"
          git push origin HEAD:chat-2026-09-17-voice-audio
