name: AuroraFox Research Quality CI

on:
  push:
    branches: [main]
    paths:
      - 'agent/research_collector.gd'
      - 'agent/learning_curator.gd'
      - 'tests/research_evidence_lifecycle_smoke.gd'
      - 'tests/research_collector_privacy_smoke.gd'
      - 'tests/research_source_resilience_smoke.gd'
      - 'tests/test_research_evidence_lifecycle_contract.py'
      - 'tests/test_research_collector_privacy_contract.py'
      - 'tests/test_research_source_resilience_contract.py'
      - 'tests/autonomy_learning_smoke.gd'
      - 'tests/test_autonomous_evolution_contract.py'
      - 'tests/test_standalone_core_contract.py'
      - '.github/workflows/research-quality-ci.yml'
  pull_request:
    paths:
      - 'agent/research_collector.gd'
      - 'agent/learning_curator.gd'
      - 'tests/research_evidence_lifecycle_smoke.gd'
      - 'tests/research_collector_privacy_smoke.gd'
      - 'tests/research_source_resilience_smoke.gd'
      - 'tests/test_research_evidence_lifecycle_contract.py'
      - 'tests/test_research_collector_privacy_contract.py'
      - 'tests/test_research_source_resilience_contract.py'
      - 'tests/autonomy_learning_smoke.gd'
      - 'tests/test_autonomous_evolution_contract.py'
      - 'tests/test_standalone_core_contract.py'
      - '.github/workflows/research-quality-ci.yml'
  workflow_dispatch:

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        env:
          AURORA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import os, subprocess, sys; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['AURORA_EXPECTED_HEAD_SHA']; print('AURORA_CI_CHECKOUT_SHA=' + actual); sys.exit(0 if actual == expected else 'Candidate checkout SHA mismatch: expected ' + expected)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.1
      - name: Run research quality contracts
        run: >-
          python -m pytest -q
          tests/test_research_evidence_lifecycle_contract.py
          tests/test_research_collector_privacy_contract.py
          tests/test_research_source_resilience_contract.py
          tests/test_autonomous_evolution_contract.py
          tests/test_standalone_core_contract.py

  godot-research-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        env:
          AURORA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import os, subprocess, sys; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['AURORA_EXPECTED_HEAD_SHA']; print('AURORA_CI_CHECKOUT_SHA=' + actual); sys.exit(0 if actual == expected else 'Candidate checkout SHA mismatch: expected ' + expected)"
      - name: Install Godot 4.7.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
          ./godot --version
      - name: Parse project
        run: timeout 90s ./godot --headless --editor --path . --quit
      - name: Run existing autonomy learning smoke
        run: timeout 45s ./godot --headless --path . --script tests/autonomy_learning_smoke.gd
      - name: Run evidence lifecycle invalidation smoke
        run: timeout 45s ./godot --headless --path . --script tests/research_evidence_lifecycle_smoke.gd
      - name: Run external-only collector privacy smoke
        run: timeout 45s ./godot --headless --path . --script tests/research_collector_privacy_smoke.gd
      - name: Run research source resilience smoke
        run: timeout 45s ./godot --headless --path . --script tests/research_source_resilience_smoke.gd
