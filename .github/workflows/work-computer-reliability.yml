name: AuroraFox Work Computer Reliability

on:
  pull_request:
    paths:
      - 'work/**'
      - 'computer/**'
      - 'scripts/computer_client.gd'
      - 'scripts/agent_core.gd'
      - 'scripts/tool_registry.gd'
      - 'scripts/sandbox_manager.gd'
      - 'tests/work_reliability_*'
      - 'tests/computer_agent_*'
      - 'tests/computer_client_response_smoke.gd'
      - 'tests/test_network_json_contract.py'
      - 'tests/work_computer_e2e_*'
      - 'tests/work_computer_attempt_safety_smoke.gd'
      - 'tests/work_computer_master_stop_smoke.gd'
      - 'tests/work_computer_concurrency_smoke.gd'
      - 'tests/autonomy_state_failure_injection_smoke.gd'
      - '.github/workflows/work-computer-reliability.yml'
  push:
    branches: [main]
    paths:
      - 'work/**'
      - 'computer/**'
      - 'scripts/computer_client.gd'
      - 'scripts/agent_core.gd'
      - 'scripts/tool_registry.gd'
      - 'scripts/sandbox_manager.gd'
      - 'tests/work_reliability_*'
      - 'tests/computer_agent_*'
      - 'tests/computer_client_response_smoke.gd'
      - 'tests/test_network_json_contract.py'
      - 'tests/work_computer_e2e_*'
      - 'tests/work_computer_attempt_safety_smoke.gd'
      - 'tests/work_computer_master_stop_smoke.gd'
      - 'tests/work_computer_concurrency_smoke.gd'
      - 'tests/autonomy_state_failure_injection_smoke.gd'
      - '.github/workflows/work-computer-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  computer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract-test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi 'uvicorn[standard]' 'pydantic>=2.11' 'httpx==0.28.1' python-multipart
      - name: Python syntax
        run: python -m py_compile computer/computer_service.py tests/computer_agent_reliability_test.py tests/computer_agent_routing_contract_test.py tests/computer_agent_failure_injection_test.py tests/computer_agent_concurrency_test.py tests/test_network_json_contract.py
      - name: Computer reliability routing failure-injection concurrency and response contracts
        run: python -m pytest -q tests/computer_agent_reliability_test.py tests/computer_agent_routing_contract_test.py tests/computer_agent_failure_injection_test.py tests/computer_agent_concurrency_test.py tests/test_network_json_contract.py

  computer-contract-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production Computer dependencies and tests
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r computer/requirements.txt pytest 'httpx==0.28.1'
      - name: Import Windows desktop runtime dependencies
        shell: pwsh
        run: python -c "import pyautogui, pywinauto; from PIL import ImageGrab; print('WINDOWS_COMPUTER_RUNTIME_IMPORT_OK')"
      - name: Python syntax
        shell: pwsh
        run: python -m py_compile computer/computer_service.py tests/computer_agent_reliability_test.py tests/computer_agent_routing_contract_test.py tests/computer_agent_failure_injection_test.py tests/computer_agent_concurrency_test.py tests/test_network_json_contract.py
      - name: Computer reliability routing failure-injection concurrency and response contracts on Windows
        shell: pwsh
        run: python -m pytest -q tests/computer_agent_reliability_test.py tests/computer_agent_routing_contract_test.py tests/computer_agent_failure_injection_test.py tests/computer_agent_concurrency_test.py tests/test_network_json_contract.py

  work-godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.1
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
          ./godot --version
      - name: Import and parse project
        run: timeout 90s ./godot --headless --editor --path . --quit
      - name: Existing Work persistence smoke
        run: timeout 30s ./godot --headless --path . --script tests/work_mode_store_smoke.gd
      - name: Work reliability lifecycle and recovery smoke
        run: timeout 60s ./godot --headless --path . --script tests/work_reliability_store_smoke.gd
      - name: Work fail-closed corruption and restart smoke
        run: timeout 40s ./godot --headless --path . --script tests/work_reliability_fail_closed_smoke.gd
      - name: Work cancel and master-stop unsafe-action race smoke
        run: timeout 40s ./godot --headless --path . --script tests/work_computer_e2e_control_smoke.gd
      - name: Work whole-attempt destructive retry smoke
        run: timeout 35s ./godot --headless --path . --script tests/work_computer_attempt_safety_smoke.gd
      - name: Work unknown unsafe-result recovery smoke
        run: timeout 30s ./godot --headless --path . --script tests/work_computer_e2e_uncertain_result_smoke.gd
      - name: Work and Computer real master-stop binding smoke
        run: timeout 30s ./godot --headless --path . --script tests/work_computer_master_stop_smoke.gd
      - name: Work concurrent task isolation smoke
        run: timeout 30s ./godot --headless --path . --script tests/work_computer_concurrency_smoke.gd
      - name: Computer HTTP response classification smoke
        run: timeout 30s ./godot --headless --path . --script tests/computer_client_response_smoke.gd
      - name: Autonomy both-corrupt state fail-closed smoke
        run: timeout 30s ./godot --headless --path . --script tests/autonomy_state_failure_injection_smoke.gd

  source-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Local-only and protected routing contracts
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'ollama|openai|gemini|claude' computer/computer_service.py
          ! grep -Eiq 'ollama pull|qwen3-vl' computer/install_computer.ps1
          grep -q 'local_core_planning_required' computer/computer_service.py
          grep -q 'ALLOW_DEGRADED_LOCAL_SANDBOX' computer/computer_service.py
          grep -q 'EXECUTION_CONTROL_PREFIX' scripts/agent_core.gd
          grep -q 'execution_guard' scripts/agent_core.gd
          grep -q 'STATE_INTERRUPTED' work/work_store.gd
          grep -q 'requires_user_action' work/work_store.gd
          grep -q 'attempt_retry_safety' work/work_store.gd
          grep -q 'unsafe_action_seen' work/work_manager.gd
          grep -q 'shared_service_token' scripts/computer_client.gd
          grep -q '_decode_response' scripts/computer_client.gd
          grep -q 'computer_action' scripts/tool_registry.gd
          grep -q 'X-AuroraFox-Computer-Token' scripts/tool_registry.gd
          grep -q 'X-AuroraFox-Computer-Token' scripts/sandbox_manager.gd
