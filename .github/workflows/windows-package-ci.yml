name: AuroraFox Windows Package CI

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'agent/**'
      - 'api/**'
      - 'scripts/**'
      - 'models/**'
      - 'voice/**'
      - 'computer/**'
      - 'file_intelligence/**'
      - 'core_runtime/**'
      - 'runtime/**'
      - 'update/**'
      - 'build/**'
      - 'tests/windows_v12_bridge_smoke.ps1'
      - 'main.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/windows-package-ci.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'agent/**'
      - 'api/**'
      - 'scripts/**'
      - 'models/**'
      - 'voice/**'
      - 'computer/**'
      - 'file_intelligence/**'
      - 'core_runtime/**'
      - 'runtime/**'
      - 'update/**'
      - 'build/**'
      - 'tests/windows_v12_bridge_smoke.ps1'
      - 'main.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/windows-package-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Windows build and release helpers
        shell: powershell
        run: |
          foreach ($script in @(
            '.\build\build_windows.ps1',
            '.\build\prepare_bundled_core_model.ps1',
            '.\build\prepare_bundled_windows_core.ps1',
            '.\build\bridge_release_readiness.ps1',
            '.\build\create_update_signing_key.ps1',
            '.\build\setup_release_signing.ps1',
            '.\tests\windows_v12_bridge_smoke.ps1'
          )) {
            if (-not (Test-Path $script)) { throw "Required Windows/release helper missing: $script" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script :: $($_.Message)" }
              throw "$script parse failed"
            }
          }

      - name: Restore bundled AuroraFox Core model cache
        uses: actions/cache@v4
        with:
          path: .ci/core-model
          key: aurorafox-core-model-d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5

      - name: Prepare complete bundled Windows Core
        shell: pwsh
        env:
          AURORAFOX_GITHUB_TOKEN: ${{ github.token }}
        run: .\build\prepare_bundled_windows_core.ps1 -CacheDir "$env:GITHUB_WORKSPACE\.ci\core-model"

      - name: Download Godot 4.7.1 and export templates
        id: godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot/releases/download/4.7.1-stable'
          New-Item -ItemType Directory -Force .ci\godot,.ci\templates | Out-Null
          Invoke-WebRequest "$base/Godot_v4.7.1-stable_win64.exe.zip" -OutFile .ci\godot.zip
          Expand-Archive .ci\godot.zip .ci\godot -Force
          $godot = (Get-ChildItem .ci\godot -Filter '*_console.exe' | Select-Object -First 1).FullName
          if (-not $godot) { $godot = (Get-ChildItem .ci\godot -Filter '*.exe' | Select-Object -First 1).FullName }
          if (-not $godot) { throw 'Godot executable not found' }
          Invoke-WebRequest "$base/Godot_v4.7.1-stable_export_templates.tpz" -OutFile .ci\templates.tpz
          Copy-Item .ci\templates.tpz .ci\templates.zip
          Expand-Archive .ci\templates.zip .ci\templates -Force
          $dest = Join-Path $env:APPDATA 'Godot\export_templates\4.7.1.stable'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $source = Join-Path (Resolve-Path .ci\templates).Path 'templates'
          Copy-Item "$source\*" $dest -Recurse -Force
          "path=$godot" >> $env:GITHUB_OUTPUT
          & $godot --version

      - name: Verify version synchronization
        shell: pwsh
        run: .\tests\version_sync_test.ps1

      - name: Import project
        shell: pwsh
        run: |
          & '${{ steps.godot.outputs.path }}' --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot project import failed' }

      - name: Build Windows package
        shell: pwsh
        run: .\build\build_windows.ps1 -Godot '${{ steps.godot.outputs.path }}' -SkipModelSetup -SkipVoiceSetup

      - name: Verify packaged runtime assets and embedded Core
        shell: pwsh
        run: |
          $required = @(
            'build\windows\AuroraFox.exe',
            'build\windows\models\install_models.ps1',
            'build\windows\voice\install_voice.ps1',
            'build\windows\computer\install_computer.ps1',
            'build\windows\file_intelligence\install_files.ps1',
            'build\windows\core_runtime\install_core.ps1',
            'build\windows\core_runtime\engine\llama-server.exe',
            'build\windows\core_runtime\engine\aurorafox-core.gguf',
            'build\windows\api\server.py',
            'build\windows\api\local_core_client.py',
            'build\windows\api\runtime_bridge.py',
            'build\windows\api\ollama_client.py',
            'build\windows\api\install_api.ps1',
            'build\windows\api\start_api.ps1',
            'build\windows\api\requirements.txt',
            'build\windows\update\windows_updater.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Packaged runtime asset missing: $path" }
          }
          $model = 'build\windows\core_runtime\engine\aurorafox-core.gguf'
          if ((Get-Item $model).Length -ne 1282439264) { throw 'Packaged AuroraFox Core weights have the wrong size' }
          $sha = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5') { throw "Packaged AuroraFox Core SHA mismatch: $sha" }

      - name: Smoke exported executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\build\windows\AuroraFox.exe' -ArgumentList @('--headless','--quit-after','3') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Exported AuroraFox.exe exited with $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $text = Get-Content project.godot -Raw
          if ($text -notmatch 'config/version="([0-9.]+)"') { throw 'application/config/version missing' }
          $version = $Matches[1]
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc "/DMyAppVersion=$version" build\AuroraFox.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          if (-not (Test-Path build\release\AuroraFox_Setup_Windows.exe)) { throw 'Installer was not produced' }

      - name: Verify V1.2 to V1.3 in-place bridge
        shell: pwsh
        run: .\tests\windows_v12_bridge_smoke.ps1 -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -CurrentInstaller '.\build\release\AuroraFox_Setup_Windows.exe'

      - name: Silent install and installed-app smoke
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'AuroraFoxInstalled'
          $installer = (Resolve-Path 'build\release\AuroraFox_Setup_Windows.exe').Path
          $p = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -PassThru -Wait
          if ($p.ExitCode -notin @(0,3010)) { throw "Installer exited with $($p.ExitCode)" }
          $exe = Join-Path $installDir 'AuroraFox.exe'
          if (-not (Test-Path $exe)) { throw 'Installed AuroraFox.exe missing' }
          foreach ($relative in @(
            'api\local_core_client.py',
            'api\runtime_bridge.py',
            'core_runtime\install_core.ps1',
            'core_runtime\engine\llama-server.exe',
            'core_runtime\engine\aurorafox-core.gguf',
            'update\windows_updater.ps1'
          )) {
            if (-not (Test-Path (Join-Path $installDir $relative))) { throw "Installed runtime asset missing: $relative" }
          }
          $installedModel = Join-Path $installDir 'core_runtime\engine\aurorafox-core.gguf'
          $installedSha = (Get-FileHash $installedModel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedSha -ne 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5') { throw 'Installed AuroraFox Core integrity check failed' }
          $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--quit-after','3') -PassThru -Wait
          if ($run.ExitCode -ne 0) { throw "Installed AuroraFox.exe exited with $($run.ExitCode)" }
          $uninstaller = Get-ChildItem $installDir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller missing' }
          $un = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($un.ExitCode -ne 0) { throw "Uninstaller exited with $($un.ExitCode)" }

      - name: Create portable ZIP, V1.2 repair installer and hashes
        shell: pwsh
        run: |
          $text = Get-Content project.godot -Raw
          if ($text -notmatch 'config/version="([0-9.]+)"') { throw 'application/config/version missing' }
          $version = $Matches[1]
          New-Item -ItemType Directory -Force dist | Out-Null
          $portable = "dist\AuroraFox-V$version-Windows-Portable.zip"
          $setup = "dist\AuroraFox-V$version-Setup-Windows.exe"
          $repair = "dist\AuroraFox-V1.2-to-V$version-Repair-Windows.exe"
          Compress-Archive -Path build\windows\* -DestinationPath $portable -CompressionLevel Optimal -Force
          Copy-Item build\release\AuroraFox_Setup_Windows.exe $setup -Force
          Copy-Item build\release\AuroraFox_Setup_Windows.exe $repair -Force
          Get-FileHash $setup -Algorithm SHA256 | ForEach-Object { "SETUP  $($_.Hash.ToLower())" } | Set-Content dist\SHA256SUMS.txt
          Get-FileHash $repair -Algorithm SHA256 | ForEach-Object { "V12_REPAIR  $($_.Hash.ToLower())" } | Add-Content dist\SHA256SUMS.txt
          Get-FileHash $portable -Algorithm SHA256 | ForEach-Object { "PORTABLE  $($_.Hash.ToLower())" } | Add-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
          Get-ChildItem dist | Select-Object Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraFox-Windows
          path: |
            dist/AuroraFox-V*-Setup-Windows.exe
            dist/AuroraFox-V1.2-to-V*-Repair-Windows.exe
            dist/AuroraFox-V*-Windows-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-v12-repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: AuroraFox-Windows
          path: dist

      - name: Prepare stable V1.2 repair assets
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          print(json.load(open('project/version.json', encoding='utf-8'))['numeric'])
          PY
          )"
          source="dist/AuroraFox-V1.2-to-V${version}-Repair-Windows.exe"
          stable='dist/AuroraFox-V1.2-Repair-Windows.exe'
          test -s "$source"
          cp "$source" "$stable"
          sha256sum "$stable" | tee dist/AuroraFox-V1.2-Repair-Windows-SHA256.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "AURORA_V12_REPAIR_PERMANENT_ASSET_READY version=$version"

      - name: Publish or refresh permanent V1.2 repair release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='repair-v1.2-windows'
          stable='dist/AuroraFox-V1.2-Repair-Windows.exe'
          sums='dist/AuroraFox-V1.2-Repair-Windows-SHA256.txt'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$stable" "$sums" --clobber
          else
            cat > "$RUNNER_TEMP/v12-repair-notes.md" <<'EOF'
          # AuroraFox V1.2 Windows Repair Bridge

          This is the one-time recovery installer for historical AuroraFox V1.2 Windows installations whose embedded signed-update trust root was incomplete.

          Run `AuroraFox-V1.2-Repair-Windows.exe` over the existing V1.2 installation. The verified bridge keeps Godot `user://` data and moves the installation onto the V1.3+ signed-update line.

          This repair release is intentionally **not** the AuroraFox `latest` release and does not replace the normal signed `update.json` channel.
          EOF
            gh release create "$tag" "$stable" "$sums" \
              --title 'AuroraFox V1.2 Windows Repair Bridge' \
              --notes-file "$RUNNER_TEMP/v12-repair-notes.md" \
              --latest=false
          fi
          echo "AURORA_V12_REPAIR_RELEASE_READY https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
