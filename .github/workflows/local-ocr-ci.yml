name: Local OCR CI

on:
  push:
    branches: [main, chat-2026-09-16-local-ocr]
    paths:
      - 'file_intelligence/**'
      - 'android_plugin/**'
      - 'addons/AuroraFoxRuntime/**'
      - 'build/build_windows.ps1'
      - 'scripts/knowledge_document_importer.gd'
      - 'scripts/file_intelligence_client.gd'
      - 'scripts/knowledge_store.gd'
      - 'tests/test_local_ocr.py'
      - 'tests/local_ocr_knowledge_smoke.gd'
      - '.github/workflows/local-ocr-ci.yml'
  pull_request:
    paths:
      - 'file_intelligence/**'
      - 'android_plugin/**'
      - 'addons/AuroraFoxRuntime/**'
      - 'build/build_windows.ps1'
      - 'scripts/knowledge_document_importer.gd'
      - 'scripts/file_intelligence_client.gd'
      - 'scripts/knowledge_store.gd'
      - 'tests/test_local_ocr.py'
      - 'tests/local_ocr_knowledge_smoke.gd'
      - '.github/workflows/local-ocr-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurorafox-local-ocr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r file_intelligence/requirements.txt pytest reportlab
      - name: Syntax and local OCR regression
        env:
          AURORAFOX_OCR_LANGUAGES: rus+eng
        run: |
          python -m py_compile file_intelligence/local_ocr.py file_intelligence/file_service.py
          PYTHONPATH=file_intelligence python -c "import local_ocr; h=local_ocr.health(); assert h['available'], h; assert set(h['languages']) >= {'rus','eng'}, h; print('AURORA_LINUX_BILINGUAL_OCR_READY', h['tessdata_dir'])"
          pytest -q tests/test_local_ocr.py

  windows-portable-ocr:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build portable File Intelligence OCR runtime
        shell: powershell
        run: .\file_intelligence\install_files.ps1 -PreparePortable
      - name: Verify packaged local-only OCR contract
        shell: powershell
        run: |
          $root = Join-Path $PWD 'file_intelligence'
          $python = Join-Path $root 'python\python.exe'
          $vendor = Join-Path $root 'vendor'
          $tesseract = Join-Path $root 'ocr_runtime\tesseract.exe'
          if (-not (Test-Path $python)) { throw 'Portable Python missing' }
          if (-not (Test-Path $tesseract)) { throw 'Bundled tesseract.exe missing' }
          if (-not (Test-Path (Join-Path $root 'ocr_runtime\tessdata\eng.traineddata'))) { throw 'eng.traineddata missing' }
          if (-not (Test-Path (Join-Path $root 'ocr_runtime\tessdata\rus.traineddata'))) { throw 'rus.traineddata missing' }
          $old = $env:PYTHONPATH
          try {
            $env:PYTHONPATH = $vendor
            Push-Location $root
            & $python -c "import local_ocr; h=local_ocr.health(); assert h['available']; assert h['network_required'] is False; assert h['external_ai_required'] is False; assert set(h['requested_languages']) == {'rus','eng'}; print('AURORA_WINDOWS_PORTABLE_OCR_OK')"
            if ($LASTEXITCODE -ne 0) { throw 'Portable OCR contract verification failed' }
          } finally {
            Pop-Location
            $env:PYTHONPATH = $old
          }

  godot-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          godot="$(find . -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$godot"
          mv "$godot" godot
          chmod +x godot
          ./godot --version
      - name: Import project and parse OCR-owned scripts
        run: timeout 90s ./godot --headless --editor --path . --quit
      - name: Run local OCR Knowledge boundary and duplicate smoke
        run: timeout 45s ./godot --headless --path . --script tests/local_ocr_knowledge_smoke.gd
      - name: Verify untrusted and process-environment contracts
        run: |
          grep -q "imported documents.*data\|документов.*данными\|документов является данными" scripts/ai_client.gd
          grep -q "external_ai_required" scripts/file_intelligence_client.gd
          grep -q 'OS.has_environment("PYTHONPATH")' scripts/file_intelligence_client.gd
          grep -q 'OS.unset_environment("PYTHONPATH")' scripts/file_intelligence_client.gd

  android-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.1' \
            'cmake;3.22.1' \
            'ndk;28.1.13356709'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
      - name: Prepare pinned Android native dependencies
        shell: pwsh
        run: ./android_plugin/setup_native.ps1
      - name: Build Android OCR plugin
        working-directory: android_plugin
        shell: bash
        run: gradle :plugin:assembleRelease --stacktrace
      - name: Verify OCR assets, packaged AAR, bridge, and final APK dependency contract
        run: |
          test -f android_plugin/plugin/build/generated/aurorafoxOcrAssets/tessdata/eng.traineddata
          test -f android_plugin/plugin/build/generated/aurorafoxOcrAssets/tessdata/rus.traineddata
          aar='android_plugin/plugin/build/outputs/aar/AuroraFoxRuntime-release.aar'
          test -f "$aar"
          unzip -l "$aar" | grep -q 'assets/tessdata/eng.traineddata'
          unzip -l "$aar" | grep -q 'assets/tessdata/rus.traineddata'
          grep -R "TessBaseAPI" android_plugin/plugin/src/main/java/com/aurorafox/runtime
          grep -R "untrusted_document" android_plugin/plugin/src/main/java/com/aurorafox/runtime
          grep -q "AndroidOcrRuntime" android_plugin/plugin/src/main/java/com/aurorafox/runtime/AndroidFileRuntime.kt
          grep -q 'fun extractDocumentText' android_plugin/plugin/src/main/java/com/aurorafox/runtime/GodotAndroidPlugin.kt
          grep -q 'files.analyze(path, "", false)' android_plugin/plugin/src/main/java/com/aurorafox/runtime/GodotAndroidPlugin.kt
          grep -q '"ocr_unavailable"' android_plugin/plugin/src/main/java/com/aurorafox/runtime/AndroidOcrRuntime.kt
          grep -q '"ocr_error"' android_plugin/plugin/src/main/java/com/aurorafox/runtime/AndroidOcrRuntime.kt
          grep -q '"ocr_failed_pages"' android_plugin/plugin/src/main/java/com/aurorafox/runtime/AndroidOcrRuntime.kt
          grep -q "cz.adaptech.tesseract4android:tesseract4android:4.9.0" addons/AuroraFoxRuntime/export_plugin.gd
          grep -q "https://jitpack.io" addons/AuroraFoxRuntime/export_plugin.gd
          ! grep -R -E "OpenAI|Gemini|Claude|Ollama" android_plugin/plugin/src/main/java/com/aurorafox/runtime/AndroidOcrRuntime.kt
