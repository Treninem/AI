name: AuroraFox Release Identity CI

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/PROJECT_MASTER_LOG.md'
      - 'project/version.json'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'update/**'
      - 'release/**'
      - 'build/set_version.ps1'
      - 'build/build_android.ps1'
      - 'build/setup_release_signing.ps1'
      - 'build/bridge_release_readiness.ps1'
      - 'build/AuroraFox.iss'
      - 'build/AuroraFox_V12_BridgeFixture.iss'
      - 'build/AuroraFox_V13_BridgeFixture.iss'
      - 'tests/test_release_identity_version_policy.py'
      - 'tests/test_update_backward_compat.py'
      - 'tests/update_smoke.gd'
      - 'tests/version_policy_test.ps1'
      - 'tests/windows_v12_bridge_smoke.ps1'
      - 'tests/windows_v13_bridge_smoke.ps1'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows-package-ci.yml'
      - '.github/workflows/updater-repair-validation.yml'
      - '.github/workflows/release-identity-ci.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/PROJECT_MASTER_LOG.md'
      - 'project/version.json'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'update/**'
      - 'release/**'
      - 'build/set_version.ps1'
      - 'build/build_android.ps1'
      - 'build/setup_release_signing.ps1'
      - 'build/bridge_release_readiness.ps1'
      - 'build/AuroraFox.iss'
      - 'build/AuroraFox_V12_BridgeFixture.iss'
      - 'build/AuroraFox_V13_BridgeFixture.iss'
      - 'tests/test_release_identity_version_policy.py'
      - 'tests/test_update_backward_compat.py'
      - 'tests/update_smoke.gd'
      - 'tests/version_policy_test.ps1'
      - 'tests/windows_v12_bridge_smoke.ps1'
      - 'tests/windows_v13_bridge_smoke.ps1'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows-package-ci.yml'
      - '.github/workflows/updater-repair-validation.yml'
      - '.github/workflows/release-identity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify OpenSSL availability
        run: openssl version
      - name: Run release identity versioning and legacy update contracts
        run: python -m pytest -q tests/test_release_identity_version_policy.py tests/test_update_backward_compat.py
      - name: Verify canonical version synchronization contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          state=json.loads(Path('project/version.json').read_text(encoding='utf-8'))
          numeric=state['numeric']
          project=Path('project.godot').read_text(encoding='utf-8')
          export=Path('export_presets.cfg').read_text(encoding='utf-8')
          manifest=json.loads(Path('update/manifest.template.json').read_text(encoding='utf-8'))
          assert f'config/version="{numeric}"' in project
          assert f'version/name="{numeric}"' in export
          assert manifest['version'] == numeric
          assert state['version'] == 'V'+numeric
          assert re.fullmatch(r'\d+\.\d+\.\d+\.\d+', numeric)
          print('AURORA_RELEASE_VERSION_POLICY_OK', numeric)
          PY

  version-execution:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse version scripts
        shell: powershell
        run: |
          foreach ($script in @('.\build\set_version.ps1','.\tests\version_policy_test.ps1','.\tests\version_sync_test.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$script :: $($_.Message)" }; throw "$script parse failed" }
          }
      - name: Execute hierarchical version policy test
        shell: powershell
        run: .\tests\version_policy_test.ps1
