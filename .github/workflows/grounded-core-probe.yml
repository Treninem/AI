name: Grounded local Core research (isolated)

on:
  push:
    branches: [experiment/v15-low-ram-model-probe]
    paths:
      - .github/workflows/grounded-core-probe.yml
      - benchmarks/core/grounded_core_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-grounded-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact experiment checkout and self-test
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m py_compile benchmarks/core/model_size_probe.py benchmarks/core/grounded_core_probe.py
          python3 benchmarks/core/grounded_core_probe.py --self-test
      - name: Fetch pinned CPU engine and current GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fox-engine"
          curl -fL --retry 2 --connect-timeout 30 --max-time 600 \
            'https://github.com/ggml-org/llama.cpp/releases/download/b11717/llama-b11717-bin-ubuntu-x64.tar.gz' \
            -o "$RUNNER_TEMP/llama-b11717.tar.gz"
          printf '%s  %s\n' '1fce11be93423044e073a9a967b99998569c4bd343220f60ef98b080385d09cb' "$RUNNER_TEMP/llama-b11717.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/llama-b11717.tar.gz" -C "$RUNNER_TEMP/fox-engine"
          curl -fL --retry 2 --connect-timeout 30 --max-time 1800 \
            'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true' \
            -o "$RUNNER_TEMP/current.gguf"
          printf '%s  %s\n' 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5' "$RUNNER_TEMP/current.gguf" | sha256sum -c -
      - name: Compare bare, sourced and unrelated-source answers
        shell: bash
        run: |
          set -euo pipefail
          engine="$(find "$RUNNER_TEMP/fox-engine" -type f -name llama-server -print -quit)"
          test -n "$engine"
          chmod +x "$engine"
          python3 benchmarks/core/grounded_core_probe.py --engine "$engine" \
            --model "$RUNNER_TEMP/current.gguf" \
            --sha256 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5' \
            --output grounded-core-probe.json
      - name: Retain only small synthetic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounded-core-probe
          path: |
            grounded-core-probe.json
            grounded-core-probe.engine.log
          if-no-files-found: warn
          retention-days: 7
